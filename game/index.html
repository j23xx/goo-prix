function statMul(def) {
  const [sp, fl, go, wt] = def.stats;
  return { spd: 1 + (sp - 3) * 0.02, flap: 1 + (fl - 3) * 0.04, goo: 1 + (go - 3) * 0.1, wt };
}

// ============================================================================================
// RACER_ART — rear-view silhouettes in white wireframe, used for rivals, the player and icons
// ============================================================================================
// Draws racer def at screen (x, y) with width `size`. o: flap (0..1 wing snap), alpha, stun, goo,
// shield, ghost, num (show number), white (fill colour), mini (thin lines for icons).
function drawRacerArt(c, def, x, y, size, o) {
  o = o || {};
  const s = size / 2;
  const lw = Math.max(1.5, size * (o.mini ? 0.05 : 0.055));
  const ink = o.color || '#fff';
  const t = o.t != null ? o.t : (world ? world.t : 0);
  c.save();
  c.translate(x, y);
  if (o.roll) c.rotate(o.roll);
  if (o.stun) c.rotate(Math.sin(t * 30) * 0.6);
  if (o.alpha != null) c.globalAlpha *= o.alpha;
  c.lineWidth = lw; c.strokeStyle = ink; c.fillStyle = '#000';
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (o.ghost) c.setLineDash([size * 0.08, size * 0.06]);
  const flap = o.flap || 0;
  // wings: two slabs that snap down on a flap
  const wingY = -s * 0.05 + flap * s * 0.35;
  const wingTip = -s * 0.35 + flap * s * 0.75;
  const wing = (dir) => {
    c.beginPath();
    c.moveTo(dir * s * 0.45, -s * 0.05);
    c.lineTo(dir * s * 1.05, wingTip);
    c.lineTo(dir * s * 1.0, wingTip + s * 0.18);
    c.lineTo(dir * s * 0.45, wingY + s * 0.2);
    c.closePath(); c.fill(); c.stroke();
  };
  if (def.shape !== 'bat') { wing(-1); wing(1); }
  const body = () => { c.fill(); c.stroke(); };
  switch (def.shape) {
    case 'bucket': { // Blorp: slime blob in a tin bucket, pinwheel on top
      c.beginPath(); c.moveTo(-s * 0.5, -s * 0.15); c.lineTo(s * 0.5, -s * 0.15); c.lineTo(s * 0.38, s * 0.55); c.lineTo(-s * 0.38, s * 0.55); c.closePath(); body();
      c.beginPath(); c.moveTo(-s * 0.44, s * 0.12); c.lineTo(s * 0.44, s * 0.12); c.stroke();
      c.beginPath(); c.arc(0, -s * 0.32, s * 0.3, Math.PI * 1.02, Math.PI * 1.98); c.closePath(); body();
      c.beginPath(); c.moveTo(0, -s * 0.62); c.lineTo(0, -s * 0.85); c.stroke();
      const a = t * 12;
      c.beginPath();
      for (let i = 0; i < 4; i++) { const aa = a + i * Math.PI / 2; c.moveTo(0, -s * 0.88); c.lineTo(Math.cos(aa) * s * 0.3, -s * 0.88 + Math.sin(aa) * s * 0.1); }
      c.stroke();
      break;
    }
    case 'teacup': { // Dame Custard: teacup under an umbrella arc
      c.beginPath(); c.moveTo(-s * 0.55, -s * 0.2); c.lineTo(s * 0.55, -s * 0.2); c.lineTo(s * 0.38, s * 0.45); c.lineTo(-s * 0.38, s * 0.45); c.closePath(); body();
      c.beginPath(); c.arc(s * 0.58, s * 0.05, s * 0.16, -Math.PI / 2, Math.PI / 2); c.stroke();
      c.beginPath(); c.ellipse(0, -s * 0.28, s * 0.36, s * 0.16, 0, Math.PI, 0); body();
      c.beginPath(); c.moveTo(0, -s * 0.4); c.lineTo(0, -s * 0.72); c.stroke();
      c.beginPath(); c.arc(0, -s * 0.72, s * 0.62, Math.PI * 1.08, Math.PI * 1.92); c.stroke();
      c.beginPath(); c.moveTo(-s * 0.58, -s * 0.92); c.quadraticCurveTo(-s * 0.3, -s * 0.78, 0, -s * 0.92); c.quadraticCurveTo(s * 0.3, -s * 0.78, s * 0.58, -s * 0.92); c.stroke();
      break;
    }
    case 'toaster': { // Sprocket: a rounded toaster with two slots
      c.beginPath(); c.roundRect(-s * 0.5, -s * 0.5, s, s * 0.95, s * 0.18); body();
      c.beginPath(); c.moveTo(-s * 0.3, -s * 0.38); c.lineTo(-s * 0.08, -s * 0.38); c.moveTo(s * 0.08, -s * 0.38); c.lineTo(s * 0.3, -s * 0.38); c.stroke();
      c.beginPath(); c.moveTo(-s * 0.35, s * 0.2); c.lineTo(s * 0.35, s * 0.2); c.stroke();
      c.beginPath(); c.arc(s * 0.32, -s * 0.05, s * 0.06, 0, TAU); c.stroke();
      break;
    }
    case 'bat': { // Nana Fang: zigzag bat wings, a round body with a bun
      const tip = -s * 0.5 + flap * s * 0.9;
      c.beginPath();
      c.moveTo(0, -s * 0.1);
      c.lineTo(-s * 1.1, tip); c.lineTo(-s * 0.85, tip + s * 0.35); c.lineTo(-s * 0.6, tip + s * 0.2); c.lineTo(-s * 0.4, s * 0.25);
      c.lineTo(s * 0.4, s * 0.25); c.lineTo(s * 0.6, tip + s * 0.2); c.lineTo(s * 0.85, tip + s * 0.35); c.lineTo(s * 1.1, tip);
      c.closePath(); body();
      c.beginPath(); c.arc(0, -s * 0.05, s * 0.32, 0, TAU); body();
      c.beginPath(); c.arc(0, -s * 0.45, s * 0.14, 0, TAU); body();
      c.beginPath(); c.moveTo(-s * 0.08, -s * 0.36); c.lineTo(s * 0.1, -s * 0.54); c.stroke(); // knitting needle in the bun
      break;
    }
    case 'mushroom': { // Moldy Greg: dome cap on a stem, copter rotor above
      c.beginPath(); c.rect(-s * 0.16, -s * 0.05, s * 0.32, s * 0.55); body();
      c.beginPath(); c.arc(0, -s * 0.05, s * 0.6, Math.PI, 0); c.closePath(); body();
      c.beginPath(); c.arc(-s * 0.25, -s * 0.28, s * 0.07, 0, TAU); c.arc(s * 0.2, -s * 0.38, s * 0.06, 0, TAU); c.stroke();
      const a = Math.cos(t * 14);
      c.beginPath(); c.moveTo(0, -s * 0.65); c.lineTo(0, -s * 0.8); c.moveTo(-s * 0.9 * a, -s * 0.82); c.lineTo(s * 0.9 * a, -s * 0.82); c.stroke();
      break;
    }
    case 'pickle': { // Zippy Pickle: tall capsule in a jar-jet with a flame
      c.beginPath(); c.roundRect(-s * 0.32, -s * 0.75, s * 0.64, s * 1.3, s * 0.12); body();
      c.beginPath(); c.rect(-s * 0.36, -s * 0.88, s * 0.72, s * 0.14); body();
      c.beginPath(); c.roundRect(-s * 0.16, -s * 0.6, s * 0.32, s * 0.95, s * 0.16); c.stroke();
      c.beginPath(); c.moveTo(-s * 0.04, -s * 0.3); c.lineTo(-s * 0.04, -s * 0.22); c.moveTo(s * 0.05, 0); c.lineTo(s * 0.05, s * 0.08); c.stroke();
      break;
    }
    case 'puffer': { // El Bubblo: spiked puffer with a luchador mask stripe
      c.beginPath();
      const n = 14;
      for (let i = 0; i <= n * 2; i++) {
        const a = (i / (n * 2)) * TAU;
        const rr = (i % 2 ? 0.48 : 0.62) * s;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr - s * 0.05;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); body();
      c.beginPath(); c.moveTo(-s * 0.45, -s * 0.1); c.quadraticCurveTo(0, -s * 0.32, s * 0.45, -s * 0.1); c.stroke();
      c.beginPath(); c.moveTo(0, -s * 0.5); c.lineTo(0, s * 0.38); c.stroke();
      break;
    }
    case 'cookie': { // Count Crumb: cookie disc with chips and a triangular cape
      c.beginPath(); c.moveTo(-s * 0.55, -s * 0.35); c.lineTo(s * 0.55, -s * 0.35); c.lineTo(s * 0.75, s * 0.6); c.lineTo(-s * 0.75, s * 0.6); c.closePath(); body();
      c.beginPath(); c.arc(0, -s * 0.15, s * 0.45, 0, TAU); body();
      c.fillStyle = ink;
      for (const [px, py] of [[-0.2, -0.3], [0.15, -0.05], [-0.1, 0.1], [0.22, -0.32], [-0.25, -0.02]]) c.fillRect(px * s - s * 0.05, py * s - s * 0.05, s * 0.1, s * 0.1);
      c.beginPath(); c.moveTo(-s * 0.4, -s * 0.48); c.lineTo(-s * 0.25, -s * 0.72); c.lineTo(-s * 0.1, -s * 0.52); c.moveTo(s * 0.4, -s * 0.48); c.lineTo(s * 0.25, -s * 0.72); c.lineTo(s * 0.1, -s * 0.52); c.stroke();
      break;
    }
  }
  c.setLineDash([]);
  // thruster: a short white flicker under the craft
  if (!o.mini) {
    c.fillStyle = ink;
    const fl = 0.5 + 0.5 * Math.sin(t * 50 + size);
    c.fillRect(-s * 0.1, s * 0.62, s * 0.2, s * (0.12 + 0.18 * fl));
  }
  // goo stickers stuck on the craft
  if (o.splats) for (const sp of o.splats) gooSplat(c, sp.x * s, sp.y * s, s * 0.28 * Math.min(1, sp.t * 2), sp.seed, Math.min(1, sp.t));
  if (o.goo) {
    c.fillStyle = GOO_C;
    for (let i = 0; i < 3; i++) { const dy = ((t * 1.3 + i * 0.37) % 1) * s * 0.9; c.fillRect(-s * 0.3 + i * s * 0.3, s * 0.2 + dy, s * 0.07, s * 0.16); }
  }
  if (o.shield) {
    c.setLineDash([size * 0.1, size * 0.07]);
    c.lineDashOffset = -t * 40;
    c.beginPath(); c.arc(0, -s * 0.1, s * 1.25, 0, TAU);
    c.strokeStyle = ink; c.lineWidth = Math.max(1, lw * 0.7); c.stroke();
    c.setLineDash([]);
  }
  c.restore();
}

// ============================================================================================
// RACER_PHYSICS — flap, dive, steer, boosts, bonks, goop, crossings and racer-vs-racer shoves
// ============================================================================================
let world = null;

function makeRacer(defIndex, isPlayer, slot) {
  const def = RACERS[defIndex];
  const row = Math.floor(slot / 2), col = slot % 2;
  return {
    def, idx: defIndex, isPlayer, stats: statMul(def),
    dist: -10 - row * 6, u: col ? 3.2 : -3.2, v: 3 + (slot % 3) * 0.6, vu: 0, vv: 0, speed: 0,
    lap: 0, finished: false, finishTime: 0, place: slot, prevPlace: slot,
    stun: 0, flapLock: 0, invuln: 0, goop: 0, boostT: 0, boostMul: 1, shield: 0, ghost: 0, geyser: 0,
    coins: 0, tank: CFG.tank, shotCd: 0, item: null, roll: 0, rollItem: null, rollTick: 0,
    diveT: 0, swoopReady: 0, swoopTier: 0, flapAnim: 0, flapBuf: 0, slipT: 0, slipAfter: 0,
    floorSlow: 0, onRail: false, splats: [], ti: 0, tBase: 0,
    lapStart: 0, lapTimes: [], bonks: 0, lapBonks: 0, hitsGiven: 0, itemHits: 0, overtakes: 0, swoops: 0, gatesClean: 0,
    stalled: 0,
    ai: { react: 0.1, noiseU: 0, noiseV: 0, noiseT: 0, shootT: rnd(0.5, 1.5), itemT: rnd(1, 3), skill: 0.7, aimT: 0 },
  };
}
function cruiseSpeed() { return CFG.cruise[game.diff] * (TRACK.mirror < 0 ? 1.08 : 1); }

function giveBoost(r, mul, time) {
  if (mul >= r.boostMul || r.boostT <= 0) { r.boostMul = mul; r.boostT = time; }
  else r.boostT = Math.max(r.boostT, time * 0.5);
  r.speed += cruiseSpeed() * (mul - 1) * 0.55;
}

function zoneAt(s, u, kind) {
  for (const z of TRACK.zones) {
    if (z.kind !== kind) continue;
    if (wrap(s - z.s0, TRACK.L) < z.s1 - z.s0 && (z.u0 == null || (u > z.u0 && u < z.u1))) return z;
  }
  return null;
}

function goopRacer(r, by, time, mul) {
  if (r.shield > 0) { popShield(r); return false; }
  r.goop = Math.min(CFG.goopMax, Math.max(r.goop, 0) + (r.goop > 0 ? 0.5 : time));
  r.goopMul = mul || CFG.goopMul;
  r.splats.push({ x: rnd(-0.5, 0.5), y: rnd(-0.5, 0.3), seed: rndInt(1, 9999), t: 4 });
  if (r.splats.length > 4) r.splats.shift();
  if (r.isPlayer) {
    windscreenGoo(rndInt(2, 3));
    sfx.splat();
  }
  return true;
}

function popShield(r) {
  r.shield = 0;
  r.invuln = Math.max(r.invuln, 0.4);
  burst(r.dist, r.u, r.v, 14, 'spark');
  // the pop shoves everyone close by
  for (const o of world.racers) if (o !== r && Math.abs(gap(r.dist, o.dist)) < 4 && Math.abs(o.u - r.u) < 4) { o.vu += Math.sign(o.u - r.u || 1) * 9; o.vv += 4; }
  if (r.isPlayer || near(r)) sfx.pop();
}

function near(r) { return !world.attract && Math.abs(gap(world.player.dist, r.dist)) < 40; }

function bonk(r, th) {
  if (r.invuln > 0 || r.ghost > 0) return;
  if (r.shield > 0) { popShield(r); return; }
  r.speed *= CFG.bonkMul;
  r.stun = CFG.stun; r.flapLock = CFG.flapLock; r.invuln = CFG.invuln;
  r.bonks++; r.lapBonks++;
  const lost = Math.min(3, r.coins);
  r.coins -= lost;
  burst(r.dist, r.u, r.v, 12, 'shard');
  for (let i = 0; i < lost; i++) burst(r.dist, r.u, r.v, 1, 'coin');
  // shunt to the nearest open point so the racer is never stuck behind a wall
  if (th) {
    const aim = th.kind === 'gate'
      ? [clamp(r.u, gateCentreU(th, world.t) - th.w / 2 + 1, gateCentreU(th, world.t) + th.w / 2 - 1), clamp(r.v, th.v - th.h / 2 + 1, th.v + th.h / 2 - 1)]
      : thingAim(th, r.u, r.v, world.t);
    if (aim) { r.u = lerp(r.u, aim[0], 0.85); r.v = lerp(r.v, aim[1], 0.85); r.vu *= 0.2; r.vv = 2; }
  }
  if (r.isPlayer) {
    shake(10); world.hitstop = 0.06; sfx.bonk();
    popup('BONK!', 'big');
    world.gateStreak = 0;
  } else if (near(r)) sfx.bonk();
}

function processCrossings(r) {
  const T = TRACK;
  const n = T.things.length;
  let guard = 0;
  while (n && r.dist >= r.tBase + T.things[r.ti].s && guard++ < 20) {
    crossThing(r, T.things[r.ti]);
    r.ti++;
    if (r.ti >= n) { r.ti = 0; r.tBase += T.L; }
  }
}

// After a racer is moved by hand (screenshot poses), point it at the next thing ahead again.
function syncCrossings(r) {
  const T = TRACK;
  r.tBase = Math.floor(r.dist / T.L) * T.L;
  r.ti = T.things.findIndex((th) => r.tBase + th.s > r.dist);
  if (r.ti < 0) { r.ti = 0; r.tBase += T.L; }
}

function crossThing(r, th) {
  const t = world.t;
  switch (th.kind) {
    case 'gate': case 'pillars': case 'blocks': case 'ball': case 'rotor': case 'laser': case 'curtain': {
      if (r.ghost > 0) break;
      const res = thingBlocks(th, r.u, r.v, t);
      if (res === 'bonk') bonk(r, th);
      else if (res === 'goop') { if (goopRacer(r, null, 1.5, 0.6) && r.isPlayer) popup('GOOPED!', 'mid'); }
      else if (r.isPlayer && (th.kind === 'gate' || th.kind === 'pillars' || th.kind === 'rotor' || th.kind === 'laser')) {
        world.gateStreak++; sfx.gate(world.gateStreak); r.gatesClean++;
        if (world.gateStreak % 10 === 0) { popup(world.gateStreak + ' CLEAN!', 'mid'); addScore(r, 100, 'stunt'); }
      }
      break;
    }
    case 'ring':
      if ((r.u - th.u) ** 2 + (r.v - th.v) ** 2 < th.r * th.r) {
        giveBoost(r, CFG.ringMul, CFG.ringTime);
        if (r.isPlayer) { sfx.ring(); popup('BOOST!', 'small'); addScore(r, 25, 'stunt'); burst(r.dist + 2, th.u, th.v, 10, 'spark'); }
      }
      break;
    case 'cube':
      if (!(th.back > 0) && Math.abs(r.u - th.u) < 1.9 && Math.abs(r.v - th.v) < 1.9) {
        th.back = 4;
        if (!r.item && r.roll <= 0) startRoll(r, th.gold);
        burst(r.dist + 1, th.u, th.v, 8, 'spark');
      }
      break;
    case 'coin': {
      const magnet = r.geyser > 0 ? 4 : 1.4;
      if (!(th.back > 0) && Math.abs(r.u - th.u) < magnet && Math.abs(r.v - th.v) < magnet) {
        th.back = 6;
        r.coins = Math.min(99, r.coins + 1);
        if (r.isPlayer) { world.coinStreak++; sfx.coin(world.coinStreak); addScore(r, 10, 'coin'); }
      }
      break;
    }
  }
}

function updateRacer(r, ctl, dt) {
  const st = r.stats;
  const s = wrap(r.dist, TRACK.L);
  r.stun = Math.max(0, r.stun - dt); r.flapLock = Math.max(0, r.flapLock - dt); r.invuln = Math.max(0, r.invuln - dt);
  r.goop = Math.max(0, r.goop - dt); r.boostT = Math.max(0, r.boostT - dt); r.shield = Math.max(0, r.shield - dt);
  r.ghost = Math.max(0, r.ghost - dt); r.geyser = Math.max(0, r.geyser - dt); r.floorSlow = Math.max(0, r.floorSlow - dt);
  r.slipAfter = Math.max(0, r.slipAfter - dt); r.swoopReady = Math.max(0, r.swoopReady - dt);
  r.flapAnim = Math.max(0, r.flapAnim - dt * 6); r.stalled = Math.max(0, r.stalled - dt);
  for (const sp of r.splats) sp.t -= dt;
  while (r.splats.length && r.splats[0].t <= 0) r.splats.shift();
  if (r.boostT <= 0) r.boostMul = 1;
  if (r.roll > 0) {
    r.roll -= dt;
    if (r.isPlayer) { r.rollTick -= dt; if (r.rollTick <= 0) { r.rollTick = 0.07; sfx.tick(); } }
    if (r.roll <= 0) { r.item = r.rollItem; r.rollItem = null; if (r.isPlayer) sfx.itemGet(); }
  }
  const finished = r.finished;
  const lowG = zoneAt(s, r.u, 'lowg');
  // ---- vertical: gravity, flap, dive and the swoop boost
  const diving = ctl.dive && r.stun <= 0;
  if (diving) {
    r.diveT += dt;
    if (r.isPlayer && (Math.abs(r.diveT - 0.35) < dt / 2 || Math.abs(r.diveT - 0.8) < dt / 2)) sfx.charge(r.diveT);
  } else {
    if (r.diveT >= CFG.swoopTiers[0][0]) { r.swoopReady = CFG.swoopWindow; r.swoopTier = r.diveT >= CFG.swoopTiers[1][0] ? 1 : 0; }
    r.diveT = 0;
  }
  let g = CFG.gravity * (lowG ? 0.55 : 1) * (1 + clamp(cyDD(s) * r.speed * r.speed * 0.02, -0.1, 0.1));
  if (diving) g += CFG.diveG;
  r.vv -= g * dt;
  const up = zoneAt(s, r.u, 'updraft');
  if (up) r.vv += up.lift * dt;
  if (ctl.flap) r.flapBuf = CFG.flapBuffer;
  if (r.flapBuf > 0 && r.flapLock <= 0 && r.stalled <= 0) {
    r.vv = CFG.flapV * st.flap * (r.goop > 0 ? CFG.goopFlap : 1) * (lowG ? 0.8 : 1);
    r.flapBuf = 0; r.flapAnim = 1;
    if (r.swoopReady > 0) {
      const tier = CFG.swoopTiers[r.swoopTier];
      giveBoost(r, tier[1], tier[2]);
      r.swoopReady = 0; r.swoops++;
      if (r.isPlayer) { sfx.swoop(r.swoopTier); popup(r.swoopTier ? 'MEGA SWOOP!' : 'SWOOP!', r.swoopTier ? 'mid' : 'small'); addScore(r, r.swoopTier ? 50 : 25, 'swoop'); }
    }
    if (r.isPlayer) sfx.flap(1 + (r.idx - 3) * 0.04);
  }
  r.flapBuf -= dt;
  r.vv = Math.max(r.vv, -(diving ? CFG.diveMaxFall : CFG.maxFall));
  r.v += r.vv * dt;
  const lo = 0.7, hi = CFG.ceil - 0.7;
  if (r.v < lo) {
    r.v = lo;
    if (r.vv < 0) { r.vv = 7; r.floorSlow = 0.3; if (r.isPlayer) { burst(r.dist + 1.5, r.u, 0.2, 6, 'dust'); sfx.scrape(); } }
  }
  if (r.v > hi) { r.v = hi; if (r.vv > 0) { r.vv = -4; r.speed *= 0.9; } }
  // ---- lateral: steering, curve push, crosswind and the side rails
  let steer = 0;
  if (r.stun <= 0) {
    if (ctl.targetU != null) steer = clamp((ctl.targetU - r.u) * 0.55 - r.vu * 0.07, -1, 1);
    else steer = ctl.steer || 0;
  }
  if (steer) r.vu += steer * CFG.latAccel * dt;
  else r.vu = damp(r.vu, 0, CFG.latDamp, dt);
  r.vu += clamp(-cxDD(s) * r.speed * r.speed * 0.5, -CFG.curvePushMax, CFG.curvePushMax) * dt;
  const wind = zoneAt(s, r.u, 'wind');
  if (wind) r.vu += wind.dir * wind.accel * dt;
  r.vu = clamp(r.vu, -CFG.latMax, CFG.latMax);
  r.u += r.vu * dt;
  const edge = CFG.halfW - 0.7;
  if (Math.abs(r.u) > edge) {
    r.u = Math.sign(r.u) * edge;
    r.vu *= -0.4;
    if (!r.onRail) { r.speed *= 0.9; if (r.isPlayer) { sfx.scrape(); burst(r.dist + 1.5, r.u, r.v, 4, 'spark'); } }
    r.onRail = true;
  } else r.onRail = false;
  // ---- forward speed
  let target = cruiseSpeed() * st.spd * (1 + 0.01 * Math.min(r.coins, 10));
  if (r.boostT > 0) target *= r.boostMul;
  if (r.ghost > 0) target *= 1.3;
  if (r.goop > 0) target *= r.goopMul || CFG.goopMul;
  if (r.floorSlow > 0) target *= 0.8;
  if (r.slipAfter > 0) target *= CFG.slipMul;
  if (r.stun > 0) target *= 0.5;
  if (!r.isPlayer && !finished) target *= rubberBand(r);
  if (finished) target = cruiseSpeed() * 0.85;
  if (world.state === 'countdown') target = 0;
  r.speed = r.speed < target ? Math.min(target, r.speed + CFG.accel * dt * (r.boostT > 0 ? 2.5 : 1)) : Math.max(target, r.speed - CFG.decel * dt);
  r.dist += r.speed * dt;
  processCrossings(r);
  // ---- goo tank
  r.tank = Math.min(CFG.tank, r.tank + CFG.tankRegen * st.goo * dt);
  r.shotCd = Math.max(0, r.shotCd - dt);
}

function rubberBand(r) {
  const p = world.player;
  const d = p.dist - r.dist;
  const nem = r.nemesis ? 1.5 : 1;
  if (d > 0) return 1 + Math.min(d / 300, 1) * CFG.rubberBehind[game.diff] * nem;
  const lastLap = p.dist > (CFG.laps - 1) * TRACK.L;
  return 1 - Math.min(-d / 250, 1) * CFG.rubberAhead[game.diff] * nem * (lastLap ? 0.5 : 1);
}

// Slipstream and racer-vs-racer shoves (weighted by the Weight stat).
function racerInteractions(dt) {
  const rs = world.racers;
  for (const a of rs) {
    let drafting = false;
    for (const b of rs) {
      if (a === b) continue;
      const dd = gap(a.dist, b.dist);
      if (dd > 4 && dd < 18 && Math.abs(b.u - a.u) < 1.5 && Math.abs(b.v - a.v) < 1.2) drafting = true;
    }
    a.slipT = drafting ? a.slipT + dt : 0;
    if (a.slipT > 0.8) { if (a.slipAfter <= 0 && a.isPlayer) popup('SLIPSTREAM!', 'small'); a.slipAfter = 0.5; }
  }
  for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
    const a = rs[i], b = rs[j];
    if (Math.abs(gap(a.dist, b.dist)) > 1.4) continue;
    const du = b.u - a.u, dv = b.v - a.v;
    if (Math.abs(du) < 1.4 && Math.abs(dv) < 1.1) {
      const wa = a.stats.wt, wb = b.stats.wt;
      const pushA = wb / (wa + wb), pushB = wa / (wa + wb);
      const sgn = du === 0 ? (i % 2 ? 1 : -1) : Math.sign(du);
      a.vu -= sgn * 10 * pushA; b.vu += sgn * 10 * pushB;
      a.u -= sgn * 0.08; b.u += sgn * 0.08;
      if ((a.isPlayer || b.isPlayer) && world.bumpCd <= 0) { sfx.scrape(); world.bumpCd = 0.3; shake(3); }
    }
  }
}

// ============================================================================================
// AI — rivals aim at the next window, flap with a reaction delay, shoot, use items, rubber-band
// ============================================================================================
function aiControl(r, dt) {
  const ai = r.ai;
  const ctl = { steer: 0, targetU: null, flap: false, dive: false };
  const T = TRACK;
  ai.noiseT -= dt;
  if (ai.noiseT <= 0) {
    ai.noiseT = rnd(0.8, 1.6);
    const spread = (1 - ai.skill) * 2.0 * (r.def.ai.sloppy ? 1.5 : 1) * (r.def.ai.precise ? 0.5 : 1);
    ai.noiseU = rnd(-1, 1) * spread * 1.4; ai.noiseV = rnd(-1, 1) * spread;
  }
  // look ahead for the next thing that blocks, and the next pickup worth a detour
  let aim = null, pickupAim = null;
  const n = T.things.length;
  let idx = r.ti, base = r.tBase;
  for (let k = 0; k < 14 && n; k++) {
    const th = T.things[idx];
    const ahead = base + th.s - r.dist;
    if (ahead > 110) break;
    const tArrive = world.t + ahead / Math.max(20, r.speed);
    if (!aim && ahead > -1) {
      if (th.kind === 'gate' || th.kind === 'pillars' || th.kind === 'blocks' || th.kind === 'ball' || th.kind === 'rotor' || th.kind === 'laser' || th.kind === 'curtain') {
        const a = thingAim(th, r.u, r.v, tArrive);
        if (a) aim = { u: a[0], v: a[1], ahead };
      }
    }
    if (!pickupAim && ahead > 3 && ahead < 45 && (th.kind === 'ring' || th.kind === 'cube' || th.kind === 'coin') && !(th.back > 0)) {
      if (th.kind !== 'cube' || !r.item) if (rnd(0, 1) < r.def.ai.greed * 0.06 + (th.kind === 'ring' && r.def.ai.precise ? 0.2 : 0)) pickupAim = { u: th.u, v: th.v, ahead };
    }
    idx++; if (idx >= n) { idx = 0; base += T.L; }
  }
  if (pickupAim) ai.pick = pickupAim;
  if (ai.pick && (ai.pick.ahead -= r.speed * dt) < 0) ai.pick = null;
  let tu, tv;
  if (aim && (!ai.pick || ai.pick.ahead > aim.ahead - 4)) { tu = aim.u; tv = aim.v; }
  else if (ai.pick) { tu = ai.pick.u; tv = ai.pick.v; }
  else { tu = lineUAt(r.dist + 25); tv = lineVAt(r.dist + 25); }
  if (r.def.ai.bully && !aim) { const p = world.player; if (Math.abs(gap(r.dist, p.dist)) < 10) { tu = p.u; tv = p.v; } }
  tu += ai.noiseU; tv += ai.noiseV * 0.7;
  tv = clamp(tv, 1.2, CFG.ceil - 1.2);
  const desired = clamp((tu - r.u) * 3.2, -CFG.latMax, CFG.latMax);
  ctl.steer = clamp((desired - r.vu) * 0.22, -1, 1);
  const want = r.v < tv - 0.45 && r.vv < 2.2;
  if (want) {
    ai.react -= dt;
    if (ai.react <= 0) { ctl.flap = true; ai.react = lerp(0.2, 0.06, ai.skill) * rnd(0.8, 1.2); }
  } else ai.react = Math.min(ai.react, lerp(0.2, 0.06, ai.skill));
  ctl.dive = r.v > tv + 3.2 && (!aim || aim.ahead > 18);
  // ---- shooting: anyone a little way ahead inside a narrow cone
  ai.shootT -= dt;
  if (ai.shootT <= 0 && world.state === 'run') {
    ai.shootT = 1 / (r.def.ai.aggr * 1.2 + 0.05) * rnd(0.6, 1.4);
    let best = null;
    for (const o of world.racers) {
      if (o === r) continue;
      const dd = gap(r.dist, o.dist);
      if (dd < 5 || dd > 45) continue;
      if (Math.abs(o.u - r.u) > dd * 0.07 + 1.2 || Math.abs(o.v - r.v) > dd * 0.07 + 1.2) continue;
      if (!best || dd < best.dd) best = { o, dd };
    }
    const nannyFirst = r.def.name === 'DAME CUSTARD' && !r.wasHit;
    if (best && r.tank >= CFG.shotCost && !nannyFirst) {
      if (!best.o.isPlayer || world.playerShotBudget > 0) {
        if (best.o.isPlayer) world.playerShotBudget -= 1;
        fireGlob(r, best.o.u + best.o.vu * 0.2, best.o.v, false);
      }
    }
  }
  // ---- items
  if (r.item) {
    ai.itemT -= dt;
    const lastLap = r.dist > (CFG.laps - 1) * T.L;
    if (ai.itemT <= 0 && (!r.def.ai.hoard || lastLap || r.item === 'bubble')) {
      ai.itemT = rnd(1, 3);
      const it = r.item;
      let use = true;
      if (it === 'bazooka') use = world.racers.some((o) => { const d = gap(r.dist, o.dist); return o !== r && d > 0 && d < 60; });
      if (it === 'sock') use = r.place > 0;
      if (it === 'balloon') use = world.racers.some((o) => { const d = gap(r.dist, o.dist); return o !== r && d < 0 && d > -40; });
      if (use) useItem(r);
    }
  }
  return ctl;
}

// ============================================================================================
// GOO — globs in flight, hits on racers, splat decals on walls, jams, block bursts
// ============================================================================================
// Fire from racer r toward the point (aimU, aimV) ~60 u ahead; big = Goo Bazooka.
function fireGlob(r, aimU, aimV, big, spreadU) {
  if (!big && r.geyser <= 0) {
    if (r.tank < CFG.shotCost || r.shotCd > 0) return false;
    r.tank -= CFG.shotCost;
  }
  r.shotCd = CFG.shotCd;
  const sp = big ? 200 : CFG.globSpeed;
  const D = 60;
  const tt = D / sp;
  const g = {
    dist: r.dist + 1.5, u: r.u, v: r.v + 0.2, vs: r.speed + sp,
    vu: (aimU - r.u) / tt + (spreadU || 0), vv: (aimV - r.v) / tt + 0.5 * CFG.globGrav * tt,
    owner: r, life: big ? 1.2 : CFG.globLife, big, r: big ? 1.5 : CFG.globR, seed: rndInt(1, 9999), hit: [],
  };
  world.globs.push(g);
  if (r.isPlayer) sfx.shoot();
  return true;
}

function updateGlobs(dt) {
  const T = TRACK;
  for (const g of world.globs) {
    const prev = g.dist;
    g.dist += g.vs * dt; g.u += g.vu * dt; g.v += g.vv * dt; g.vv -= CFG.globGrav * dt;
    g.life -= dt;
    if (g.v < 0) { g.life = 0; burst(g.dist, g.u, 0.1, 5, 'goo'); continue; }
    if (Math.abs(g.u) > CFG.halfW) { g.life = 0; burst(g.dist, clamp(g.u, -CFG.halfW, CFG.halfW), g.v, 5, 'goo'); continue; }
    // racers
    for (const o of world.racers) {
      if (o === g.owner || g.hit.includes(o)) continue;
      const reach = g.big ? 2.4 : 1.3;
      if (Math.abs(gap(g.dist, o.dist)) < reach + g.vs * dt * 0.5 && Math.abs(o.u - g.u) < reach && Math.abs(o.v - g.v) < reach) {
        g.hit.push(o);
        hitRacer(o, g.owner, g.big ? 'bazooka' : 'goo');
        if (!g.big) { g.life = 0; break; }
      }
    }
    if (g.life <= 0) continue;
    // sock and balloon entities can be shot down
    for (const e of world.ents) {
      if (e.owner === g.owner && e.kind === 'sock') continue;
      if (Math.abs(gap(g.dist, e.dist)) < 1.5 + g.vs * dt && Math.abs(e.u - g.u) < 1.4 && Math.abs(e.v - g.v) < 1.4) {
        e.hp--; if (!g.big) g.life = 0;
        burst(e.dist, e.u, e.v, 8, 'goo');
        if (g.owner.isPlayer) { sfx.wallSplat(); if (e.hp <= 0) popup(e.kind === 'sock' ? 'SOCK DOWN!' : 'POP!', 'small'); }
      }
    }
    if (g.life <= 0) continue;
    // world things crossed this frame
    const sPrev = wrap(prev, T.L), step = g.dist - prev;
    for (const th of T.things) {
      const ahead = wrap(th.s - sPrev, T.L);
      if (ahead > step) continue;
      if (th.kind === 'blocks') {
        for (const b of th.blocks) {
          if (b.hp > 0 && Math.abs(g.u - b.u) < 1.2 && Math.abs(g.v - b.v) < 1.2) {
            b.hp = 0;
            burst(g.dist, b.u, b.v, 10, 'shard');
            g.owner.coins = Math.min(99, g.owner.coins + 1);
            if (g.owner.isPlayer) { sfx.coin(5); popup('+1 COIN', 'small'); addScore(g.owner, 30, 'coin'); }
            if (!g.big) g.life = 0;
          }
        }
        if (g.life <= 0) break;
        continue;
      }
      if (th.kind === 'gate' || th.kind === 'pillars' || th.kind === 'rotor' || th.kind === 'ball') {
        if (thingBlocks(th, g.u, g.v, world.t) === 'bonk') {
          addDecal(th, g.u, g.v, g.big ? 1.6 : 0.9);
          if (th.kind === 'rotor') { th.jam = 3; if (g.owner.isPlayer) popup('JAMMED!', 'small'); }
          if (g.owner.isPlayer && relDz(th.s) < 80) sfx.wallSplat();
          burst(g.dist, g.u, g.v, 6, 'goo');
          g.life = 0; break;
        }
      }
    }
  }
  world.globs = world.globs.filter((g) => g.life > 0);
  if (world.globs.length > 60) world.globs.splice(0, world.globs.length - 60);
}

function addDecal(th, u, v, r) {
  th.decals.push({ u, v, r: r * rnd(0.8, 1.25), seed: rndInt(1, 99999) });
  world.decalList.push(th);
  if (world.decalList.length > 80) { const old = world.decalList.shift(); old.decals.shift(); }
}

function hitRacer(o, by, kind) {
  if (o.isPlayer && world.playerHitCd > 0 && !by.isPlayer) return;
  if (o.shield > 0) { popShield(o); return; }
  if (kind === 'bazooka') { o.stun = Math.max(o.stun, 0.8); o.speed *= 0.6; }
  if (kind === 'sock') { o.stun = Math.max(o.stun, 1.2); o.speed *= 0.5; }
  goopRacer(o, by, kind === 'goo' ? CFG.goopTime : 2);
  o.wasHit = true;
  burst(o.dist, o.u, o.v, kind === 'goo' ? 10 : 22, 'goo');
  if (o.isPlayer) {
    world.playerHitCd = 1.5;
    shake(kind === 'goo' ? 5 : 12);
    if (kind !== 'goo') popup(kind === 'sock' ? 'SOCKED!' : 'BAZOOKA\'D!', 'big');
    if (kind !== 'goo') world.flash = 0.06;
  }
  if (by && by.isPlayer) {
    by.hitsGiven++;
    if (kind !== 'goo') by.itemHits++;
    const now = world.t;
    world.combo = now - world.comboT < 2 ? Math.min(5, world.combo + 1) : 1;
    world.comboT = now;
    const pts = (kind === 'goo' ? 100 : 250) * world.combo;
    addScore(by, pts, kind === 'goo' ? 'splat' : 'item');
    const words = ['SPLAT!', 'SPLAT x2!', 'SPLAT x3!', 'SPLAT x4!', 'SPLAT x5!'];
    worldPopup(words[world.combo - 1] + ' +' + pts, o.dist, o.u, o.v + 1.8);
    sfx.splat();
    if (o.def.bark && rand() < 0.35) bark(o, o.def.bark);
  } else if (near(o)) sfx.wallSplat();
}

// ============================================================================================
// ITEMS — jelly-cube roulette (rank weighted), the eight items and their world entities
// ============================================================================================
const ITEMS = {
  burp: { name: 'TURBO BURP', glyph: 'B' }, bazooka: { name: 'GOO BAZOOKA', glyph: 'Z' }, sock: { name: 'HOMING SOCK', glyph: 'S' },
  balloon: { name: 'SLUDGE BALLOON', glyph: 'O' }, bubble: { name: 'BUBBLE WRAP', glyph: 'W' }, ghost: { name: 'GHOST PEPPER', glyph: 'G' },
  geyser: { name: 'GOO GEYSER', glyph: 'Y' }, sneeze: { name: 'MEGA SNEEZE', glyph: 'X' },
};
// Drop odds (%) by rank band: 1st, 2-3, 4-5, 6-8.
const ODDS = {
  balloon: [35, 20, 10, 5], bubble: [30, 20, 12, 8], geyser: [20, 15, 12, 10], burp: [10, 20, 22, 22],
  bazooka: [5, 15, 18, 15], sock: [0, 10, 16, 15], ghost: [0, 0, 8, 15], sneeze: [0, 0, 2, 10],
};
function startRoll(r, gold) {
  const place = Math.min(7, r.place + (gold ? 2 : 0));
  const band = place === 0 ? 0 : place <= 2 ? 1 : place <= 4 ? 2 : 3;
  const table = Object.keys(ODDS).map((k) => [k, ODDS[k][band]]).filter((row) => row[1] > 0);
  r.rollItem = weighted(table);
  r.roll = r.isPlayer ? 0.9 : 0.5;
  r.rollTick = 0;
}

function useItem(r) {
  const it = r.item;
  if (!it || r.roll > 0) return;
  r.item = null;
  const P = r.isPlayer;
  switch (it) {
    case 'burp':
      giveBoost(r, 1.6, 1.5);
      for (const o of world.racers) { const d = gap(r.dist, o.dist); if (o !== r && d < 0 && d > -4 && Math.abs(o.u - r.u) < 4) { o.speed *= 0.6; o.vv += 6; } }
      burst(r.dist - 1, r.u, r.v, 16, 'dust');
      if (P || near(r)) sfx.burp();
      if (P) popup('BUUURP!', 'big');
      break;
    case 'bazooka': {
      const tgt = aimTargetFor(r);
      fireGlob(r, tgt ? tgt.u : r.u, tgt ? tgt.v : r.v, true);
      if (P || near(r)) sfx.launch();
      break;
    }
    case 'sock': {
      const ahead = r.place > 0 ? world.order[r.place - 1] : null;   // the racer one place ahead in the race
      world.ents.push({ kind: 'sock', dist: r.dist + 2, u: r.u, v: r.v, target: ahead, owner: r, hp: 2, life: 9, vu: 0, vv: 0 });
      if (P || near(r)) sfx.launch();
      if (ahead && ahead.isPlayer) sfx.sock();
      break;
    }
    case 'balloon':
      world.ents.push({ kind: 'balloon', dist: r.dist - 3, u: r.u, v: r.v, owner: r, hp: 1, life: 20, phase: rnd(0, TAU) });
      if (P) sfx.pop();
      break;
    case 'bubble':
      r.shield = 8;
      if (P) { sfx.shield(); popup('BUBBLE WRAP!', 'small'); }
      break;
    case 'ghost':
      r.ghost = 3;
      if (P) { sfx.swoop(1); popup('GHOST PEPPER!', 'mid'); }
      break;
    case 'geyser':
      r.geyser = 6; r.tank = CFG.tank;
      if (P) { sfx.itemGet(); popup('GOO GEYSER!', 'mid'); }
      break;
    case 'sneeze':
      for (const o of world.racers) {
        if (o === r || o.dist < r.dist || o.dist - r.dist > 300) continue;
        o.vv += rnd(-1, 1) > 0 ? 9 : -9; o.vu += rnd(-8, 8);
        goopRacer(o, r, 1.2);
        if (P) addScore(r, 100, 'item');
      }
      if (P || world.player.dist > r.dist) { world.flash = 0.08; shake(16); sfx.sneeze(); }
      if (P) popup('AAAH-CHOO!', 'big');
      break;
  }
}

// Nearest rival ahead within a forward cone (used by auto-aim and the bazooka).
function aimTargetFor(r) {
  let best = null;
  for (const o of world.racers) {
    if (o === r) continue;
    const dd = gap(r.dist, o.dist);
    if (dd < 3 || dd > 70) continue;
    const off = Math.hypot(o.u - r.u, o.v - r.v);
    if (off > dd * 0.32 + 1.5) continue;
    const score = dd + off * 4;
    if (!best || score < best.score) best = { o, score };
  }
  if (!best) return null;
  const o = best.o;
  const tt = gap(r.dist, o.dist) / CFG.globSpeed;
  return { u: o.u + o.vu * tt, v: o.v + o.vv * tt * 0.5, o };
}

function updateEnts(dt) {
  for (const e of world.ents) {
    e.life -= dt;
    if (e.kind === 'sock') {
      const tg = e.target && !e.target.finished ? e.target : null;
      const sp = tg ? Math.max(tg.speed * 1.5, 80) : 90;
      e.dist += sp * dt;
      if (tg) {
        const d = gap(e.dist, tg.dist);
        if (d < -2) e.dist += (d + 2);   // never overshoot: the sock waits just behind its victim
        e.vu = damp(e.vu, (tg.u - e.u) * 4, 6, dt); e.vv = damp(e.vv, (tg.v - e.v) * 4, 6, dt);
        e.u += e.vu * dt; e.v += e.vv * dt;
        if (Math.abs(gap(e.dist, tg.dist)) < 1.6 && Math.abs(tg.u - e.u) < 1.6 && Math.abs(tg.v - e.v) < 1.6) {
          hitRacer(tg, e.owner, 'sock'); e.life = 0;
          burst(e.dist, e.u, e.v, 16, 'dust');
        }
      }
    } else if (e.kind === 'balloon') {
      e.phase += dt;
      e.uu = e.u + Math.sin(e.phase * 0.9) * 2;
      for (const o of world.racers) {
        if (o === e.owner && e.life > 19) continue;
        if (Math.abs(gap(e.dist, o.dist)) < 1.5 && Math.abs(o.u - e.uu) < 1.6 && Math.abs(o.v - e.v) < 1.6) {
          if (goopRacer(o, e.owner, 1.5, 0.5) && o.isPlayer) popup('SLUDGED!', 'mid');
          e.life = 0; burst(e.dist, e.uu, e.v, 18, 'goo');
          if (o.isPlayer || near(o)) sfx.pop();
          break;
        }
      }
    }
    if (e.hp <= 0) e.life = 0;
  }
  world.ents = world.ents.filter((e) => e.life > 0);
}

function drawEnt(c, e, dz) {
  projectDz(dz, e.kind === 'balloon' ? e.uu : e.u, e.v, PT);
  const k = PT.k, lvl = fogLevel(dz);
  if (e.kind === 'sock') {
    // a stinky sock with fly wings: an L shape and two flicking wing lines
    c.save(); c.translate(PT.x, PT.y);
    const s = Math.max(4, k * 0.9);
    c.strokeStyle = GREYS[lvl]; c.fillStyle = '#000'; c.lineWidth = Math.max(1.5, s * 0.12);
    c.beginPath(); c.moveTo(-s * 0.3, -s); c.lineTo(s * 0.2, -s); c.lineTo(s * 0.2, s * 0.2); c.lineTo(s * 0.7, s * 0.2); c.lineTo(s * 0.7, s * 0.6); c.lineTo(-s * 0.3, s * 0.6); c.closePath(); c.fill(); c.stroke();
    const w = Math.sin(world.t * 60) * s * 0.4;
    c.beginPath(); c.moveTo(-s * 0.3, -s * 0.6); c.lineTo(-s * 1.0, -s * 0.9 - w); c.moveTo(s * 0.2, -s * 0.6); c.lineTo(s * 0.9, -s * 0.9 - w); c.stroke();
    c.fillStyle = GOO_C; c.globalAlpha = 0.6;
    for (let i = 0; i < 3; i++) c.fillRect(-s * 0.5 + i * s * 0.4, -s * 1.5 - ((world.t * 2 + i * 0.3) % 1) * s, s * 0.12, s * 0.12);
    c.restore();
  } else {
    const r = Math.max(3, k * 1.2);
    gooBlob(c, PT.x, PT.y, r, 7, world.t * 0.5, '#000');
    c.strokeStyle = GOO_C; c.lineWidth = Math.max(1.5, r * 0.12); c.stroke();
    c.beginPath(); c.moveTo(PT.x, PT.y + r); c.lineTo(PT.x, PT.y + r * 1.8); c.strokeStyle = GREYS[lvl]; c.lineWidth = 1.5; c.stroke();
    gooBlob(c, PT.x - r * 0.3, PT.y - r * 0.3, r * 0.25, 2, world.t, '#fff');
  }
}

// ============================================================================================
// PARTICLES_FX — shards, dust, goo drops, popups, windscreen goo, shake, flash and speed dashes
// ============================================================================================
function burst(dist, u, v, n, kind) {
  for (let i = 0; i < n; i++) {
    world.parts.push({
      kind, dist, u, v,
      vd: rnd(-6, 10) + (kind === 'coin' ? -8 : 0), vu: rnd(-7, 7), vv: rnd(-2, 9),
      life: kind === 'shard' ? rnd(0.5, 0.9) : rnd(0.3, 0.7), max: 0.8,
      size: kind === 'shard' ? rnd(0.25, 0.6) : rnd(0.12, 0.3), spin: rnd(0, TAU),
    });
  }
  if (world.parts.length > 400) world.parts.splice(0, world.parts.length - 400);
}
function updateParts(dt) {
  for (const p of world.parts) {
    p.dist += p.vd * dt; p.u += p.vu * dt; p.v += p.vv * dt; p.vv -= 18 * dt; p.life -= dt; p.spin += dt * 9;
    if (p.v < 0) { p.v = 0; p.vv *= -0.4; }
  }
  world.parts = world.parts.filter((p) => p.life > 0);
  for (const pp of world.popups) pp.t += dt;
  world.popups = world.popups.filter((pp) => pp.t < pp.max);
  for (const w of world.wind) { w.t += dt; w.y += w.vy * dt; w.vy += 6 * dt; }
  world.wind = world.wind.filter((w) => w.t < w.max);
  for (const b of world.barks) b.t += dt;
  world.barks = world.barks.filter((b) => b.t < 2);
  world.shake = Math.max(0, world.shake - dt * 30);
  world.flash = Math.max(0, world.flash - dt);
}
function drawPart(c, p, dz) {
  projectDz(dz, p.u, p.v, PT);
  const s = Math.max(1.5, PT.k * p.size);
  const a = clamp(p.life / 0.4, 0, 1);
  c.globalAlpha = a;
  if (p.kind === 'goo') { c.fillStyle = GOO_C; c.fillRect(PT.x - s / 2, PT.y - s / 2, s, s); }
  else if (p.kind === 'shard') {
    c.save(); c.translate(PT.x, PT.y); c.rotate(p.spin);
    c.fillStyle = GREYS[fogLevel(dz)]; c.fillRect(-s, -s * 0.4, s * 2, s * 0.8); c.restore();
  } else if (p.kind === 'coin') { c.fillStyle = '#fff'; c.fillRect(PT.x - s, PT.y - s, s * 2, s * 2); }
  else { c.fillStyle = p.kind === 'spark' ? '#fff' : '#909090'; c.fillRect(PT.x - s / 2, PT.y - s / 2, s, s); }
  c.globalAlpha = 1;
}
const POP_SIZES = { big: 11, mid: 8, small: 5 };
function popup(text, size) {
  // centre-upper announcer text; a newer one replaces any of the same size
  world.popups = world.popups.filter((p) => p.world || p.size !== size);
  world.popups.push({ text, size, t: 0, max: size === 'big' ? 1.1 : 0.9 });
}
function worldPopup(text, dist, u, v) { world.popups.push({ text, size: 'small', t: 0, max: 0.9, world: true, dist, u, v }); }
function bark(r, text) { world.barks.push({ r, text, t: 0 }); }
function shake(px) { world.shake = Math.max(world.shake, px); }
function windscreenGoo(n) {
  for (let i = 0; i < n; i++) {
    const side = rand() < 0.5 ? -1 : 1;
    world.wind.push({ x: W / 2 + side * rnd(180, 520), y: rnd(150, 470), r: rnd(40, 75), seed: rndInt(1, 9999), t: 0, max: 2, vy: rnd(5, 20) });
  }
  if (world.wind.length > 4) world.wind.splice(0, world.wind.length - 4);
}
// Splat Score, kept per category so the results screen can break it down line by line.
function addScore(r, n, cat) {
  if (!r.isPlayer) return;
  world.score += n;
  const k = cat || 'stunt';
  world.scoreBy[k] = (world.scoreBy[k] || 0) + n;
}

// ============================================================================================
// RACE — setup and grid, countdown and rocket starts, laps, positions, finish and race results
// ============================================================================================
const game = {
  scene: 'title', diff: 1, racer: 0, scheme: 'keys', mirror: false, cup: null, lastResults: null,
  wipe: null, sceneT: 0, paused: false, menu: { i: 0 }, pauseMenu: { i: 0 }, quickTrack: 0, selRow: 0,
};

function setupRace(trackIdx, opts) {
  opts = opts || {};
  TRACK = buildTrack(trackIdx, { mirror: game.mirror, diff: game.diff });
  world = {
    t: 0, racers: [], globs: [], ents: [], parts: [], popups: [], wind: [], barks: [], decalList: [],
    state: 'countdown', countdown: 3.2, lastBeep: 4, score: 0, scoreBy: {}, gateStreak: 0, coinStreak: 0, combo: 0, comboT: -9,
    shake: 0, flash: 0, hitstop: 0, playerHitCd: 0, playerShotBudget: 2, bumpCd: 0, incoming: 0, warnSide: 0, warnCd: 0,
    doneT: 0, slowmo: 0, player: null, attract: !!opts.attract, camU: 0, camV: 6, camRoll: 0, camF: CFG.focal, camHz: CFG.horizon,
    preFlap: null, goT: 0, raceIndex: game.cup && !opts.attract ? game.cup.race : 0, trackIdx, lastPlace: 7, introT: 0,
    order: [], aim: { x: W / 2, y: CFG.horizon, u: 0, v: 6, lock: null, lockT: 0 }, cleanLaps: 0,
  };
  const order = gridOrder(!!opts.attract);
  const [lo, hi] = CFG.aiSkill[game.diff];
  order.forEach((defIdx, slot) => {
    const isPlayer = !opts.attract && defIdx === game.racer;
    const r = makeRacer(defIdx, isPlayer, slot);
    r.ai.skill = clamp(lerp(lo, hi, world.raceIndex / 4) + (r.def.ai.precise ? 0.06 : 0) - (r.def.ai.sloppy ? 0.08 : 0) + rnd(-0.03, 0.03), 0.4, 0.95);
    world.racers.push(r);
    if (isPlayer) world.player = r;
  });
  if (!world.player) world.player = world.racers[2];
  const nemIdx = game.racer === 7 ? 0 : 7;
  for (const r of world.racers) r.nemesis = !opts.attract && r.idx === nemIdx;
  world.camU = world.player.u; world.camV = world.player.v + CFG.camUp;
  updatePlaces();
  world.lastPlace = world.player.place;
}

function gridOrder(attract) {
  const all = [0, 1, 2, 3, 4, 5, 6, 7];
  if (!attract && game.cup && game.cup.race > 0) {
    // reverse standings: the leader starts at the back
    return all.slice().sort((a, b) => (game.cup.pts[a] - game.cup.pts[b]) || (b - a));
  }
  const others = all.filter((i) => attract || i !== game.racer);
  for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
  if (!attract) others.push(game.racer);
  return others;
}

function updatePlaces() {
  const rs = world.racers.slice().sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.dist - a.dist;
  });
  rs.forEach((r, i) => { r.prevPlace = r.place; r.place = i; });
  world.order = rs;
}

function raceTime() { return world.state === 'countdown' ? 0 : world.t - world.goT; }

function startGo() {
  const w = world;
  w.state = 'run'; w.goT = w.t;
  for (const r of w.racers) r.lapStart = w.t;
  if (w.attract) { for (const r of w.racers) r.speed = cruiseSpeed() * 0.9; return; }
  sfx.beep(true);
  popup('GO!', 'big');
  const p = w.player;
  if (w.preFlap != null && w.preFlap <= 0.12) rocket(p);
  else if (w.preFlap != null && w.preFlap <= 0.6) { p.stalled = 0.5; popup('STALLED!', 'mid'); }
  // rivals: perfect starters and the rest by luck and skill
  for (const r of w.racers) if (!r.isPlayer && (r.def.ai.sloppy || rand() < r.ai.skill * 0.45)) giveBoost(r, CFG.rocketMul, 1.0);
}
function rocket(r) {
  giveBoost(r, CFG.rocketMul, 1.2);
  r.rocketed = true;
  if (r.isPlayer) { popup('ROCKET START!', 'mid'); addScore(r, 100, 'stunt'); sfx.swoop(1); }
}

function raceStep(dt) {
  const w = world;
  w.t += dt;
  const p = w.player;
  if (w.state === 'countdown') {
    w.countdown -= dt;
    const n = Math.ceil(w.countdown);
    if (!w.attract && n < w.lastBeep && n >= 1 && n <= 3) { w.lastBeep = n; sfx.beep(false); }
    if (!w.attract && flapKeyHit()) w.preFlap = w.countdown;
    for (const r of w.racers) { r.flapAnim = Math.max(0, r.flapAnim - dt * 6); if (rand() < 0.02) r.flapAnim = 1; }
    if (w.countdown <= 0) startGo();
    updateThings(TRACK, w.t, dt); updateParts(dt);
    return;
  }
  if (!w.attract && w.t - w.goT < 0.12 && !p.rocketed && w.preFlap == null && flapKeyHit()) rocket(p);
  w.playerShotBudget = Math.min(2, w.playerShotBudget + 2 * dt);
  w.playerHitCd = Math.max(0, w.playerHitCd - dt);
  w.bumpCd = Math.max(0, w.bumpCd - dt);
  w.warnCd = Math.max(0, w.warnCd - dt);
  for (const r of w.racers) {
    const ctl = r.isPlayer && !w.autopilot ? playerControl(r, dt) : aiControl(r, dt);
    updateRacer(r, ctl, dt);
    const lap = Math.floor(Math.max(0, r.dist) / TRACK.L);
    if (lap > r.lap && !r.finished) {
      r.lapTimes.push(w.t - r.lapStart); r.lapStart = w.t; r.lap = lap;
      if (r.isPlayer) playerLap(r);   // also scores the clean final lap as the player crosses the line
      r.lapBonks = 0;
    }
    if (!r.finished && r.dist >= CFG.laps * TRACK.L) {
      r.finished = true; r.finishTime = w.t - w.goT;
      if (r.isPlayer) playerFinished(r);
    }
  }
  racerInteractions(dt);
  updateGlobs(dt);
  updateEnts(dt);
  updateThings(TRACK, w.t, dt);
  updateParts(dt);
  updatePlaces();
  if (!w.attract && w.state === 'run') {
    if (p.place < w.lastPlace) { sfx.posUp(); p.overtakes += w.lastPlace - p.place; addScore(p, 50, 'stunt'); popup('OVERTAKE!', 'small'); }
    else if (p.place > w.lastPlace) sfx.posDown();
    w.lastPlace = p.place;
    incomingCheck(p);
  }
  if (w.state === 'done') {
    w.doneT += dt;
    if (w.doneT > 3.2 && !w.leaving) { w.leaving = true; finalizeRace(); goTo('results'); }
  }
}

function playerLap(p) {
  const w = world;
  if (p.lapBonks === 0) { w.cleanLaps++; addScore(p, 300, 'clean'); if (p.lap < CFG.laps) popup('CLEAN LAP!', 'small'); }
  if (p.lap >= CFG.laps) return;   // that was the finish line, not a new lap
  if (p.lap === CFG.laps - 1) {
    popup('FINAL LAP!', 'big'); sfx.fanfare();
    MUSIC.tempoMul = 1.08; MUSIC.transpose = 1;
  } else popup('LAP ' + (p.lap + 1), 'mid');
}

function playerFinished(p) {
  const w = world;
  w.state = 'done'; w.doneT = 0;
  const close = w.racers.some((o) => o !== p && Math.abs(o.dist - p.dist) < 9);
  if (close) { w.slowmo = 0.6; popup('PHOTO FINISH!', 'mid'); }
  popup(ORD[p.place] + ' PLACE!', 'big');
  sfx.finish();
  MUSIC.tempoMul = 1; MUSIC.transpose = 0;
}

function finalizeRace() {
  const w = world;
  const p = w.player;
  const L = TRACK.L;
  for (const r of w.racers) {
    if (!r.finished) {
      r.finishTime = (w.t - w.goT) + Math.max(0, CFG.laps * L - r.dist) / (cruiseSpeed() * 0.97 * r.stats.spd);
      r.finished = true;
    }
  }
  const order = w.racers.slice().sort((a, b) => a.finishTime - b.finishTime);
  const pos = order.indexOf(p);
  const bestLap = p.lapTimes.length ? Math.min(...p.lapTimes) : 0;
  let fastest = true;
  for (const r of w.racers) if (r !== p) for (const lt of r.lapTimes) if (lt < bestLap) fastest = false;
  const cup = game.cup;
  const dnq = cup && cup.mode === 'cup' && pos >= 5;
  const finishBonus = (8 - pos) * 500;
  const fastBonus = fastest && bestLap ? 500 : 0;
  const key = TRACK.index + ':' + game.diff + (game.mirror ? 'm' : '');
  const newBestRace = !save.bestRace[key] || p.finishTime < save.bestRace[key];
  const newBestLap = bestLap && (!save.bestLap[key] || bestLap < save.bestLap[key]);
  if (newBestRace) save.bestRace[key] = p.finishTime;
  if (newBestLap) save.bestLap[key] = bestLap;
  save.wallet += p.coins;
  writeSave();
  const sb = w.scoreBy;
  const res = {
    trackIdx: TRACK.index, pos, time: p.finishTime, bestLap, dnq,
    order: order.map((r, i) => ({ idx: r.idx, time: r.finishTime, isPlayer: r.isPlayer, pts: CFG.points[i] })),
    lines: [
      ['FINISH ' + ORD[pos], finishBonus],
      ['SPLATS x' + p.hitsGiven, sb.splat || 0],
      ['ITEM HITS x' + p.itemHits, sb.item || 0],
      ['SWOOPS x' + p.swoops, sb.swoop || 0],
      ['COINS x' + p.coins, sb.coin || 0],
      ['CLEAN LAPS x' + w.cleanLaps, sb.clean || 0],
      ['RINGS, PASSES, STUNTS', sb.stunt || 0],
      [fastest ? 'FASTEST LAP!' : 'FASTEST LAP: NOT YOURS', fastBonus],
    ],
    raceScore: w.score + finishBonus + fastBonus,
    newBestRace, newBestLap,
  };
  if (cup && !dnq) {
    order.forEach((r, i) => { cup.pts[r.idx] += CFG.points[i]; });
    cup.score += res.raceScore;
    cup.lastWins = order.map((r) => r.idx);
    cup.splats += p.hitsGiven;
    if (bestLap && (!cup.bestLap || bestLap < cup.bestLap)) cup.bestLap = bestLap;
  }
  game.lastResults = res;
}

function incomingCheck(p) {
  const w = world;
  w.incoming = 0;
  for (const g of w.globs) {
    if (g.owner === p) continue;
    const dd = gap(g.dist, p.dist);
    if (dd <= 0 || dd > 50) continue;
    const rel = g.vs - p.speed;
    if (rel <= 0) continue;
    if (dd / rel < 0.5 && Math.abs(g.u - p.u) < 2.6 && Math.abs(g.v - p.v) < 2.6) {
      w.incoming = 1; w.warnSide = Math.sign(g.u - p.u) || 1;
    }
  }
  for (const e of w.ents) if (e.kind === 'sock' && e.target === p && gap(e.dist, p.dist) < 40) { w.incoming = 1; w.warnSide = Math.sign(e.u - p.u) || 1; }
  if (w.incoming && w.warnCd <= 0) { sfx.warn(); w.warnCd = 0.6; }
}

// ============================================================================================
// CONTROLS — the player's two schemes (KEYS: fly on keys, aim with the mouse; MOUSE: all mouse)
// ============================================================================================
function flapKeyHit() { return keyHit('Space', 'KeyW', 'ArrowUp') || (game.scheme === 'mouse' && input.click); }
function setScheme(s) { if (game.scheme !== s) { game.scheme = s; save.scheme = s; writeSave(); } }

function unproject(dz, x, y) {
  const S = slabAt(dz);
  const det = S.ax * S.by - S.bx * S.ay;
  const dx = x - S.ox, dy = y - S.oy;
  return { u: (dx * S.by - S.bx * dy) / det, v: (S.ax * dy - dx * S.ay) / det };
}

function playerControl(p, dt) {
  if (p.finished) return aiControl(p, dt);
  const ctl = { steer: 0, targetU: null, flap: false, dive: false };
  const mouseScheme = game.scheme === 'mouse';
  const kSteer = (keyDown('KeyD', 'ArrowRight') ? 1 : 0) - (keyDown('KeyA', 'ArrowLeft') ? 1 : 0);
  if (kSteer && mouseScheme) setScheme('keys');
  ctl.steer = kSteer;
  ctl.flap = keyHit('Space', 'KeyW', 'ArrowUp');
  ctl.dive = keyDown('KeyS', 'ArrowDown');
  if (game.scheme === 'mouse') {
    if (input.mouseIn) ctl.targetU = clamp(unproject(22, input.mx, input.my).u, -CFG.halfW, CFG.halfW);
    if (input.click) ctl.flap = true;
    if (input.rmb) ctl.dive = true;
  }
  updateAim(p, dt);
  const autoKey = keyDown('KeyF', 'KeyJ');
  const wantShoot = autoKey || (!mouseScheme && input.lmb) || (mouseScheme && world.aim.lockT > 0.25);
  if (wantShoot && p.shotCd <= 0) {
    const a = autoKey ? (aimTargetFor(p) || { u: p.u, v: p.v + 0.6 }) : world.aim;
    if (p.geyser > 0) for (const sp of [-6, 0, 6]) { fireGlob(p, a.u, a.v, false, sp); }
    else fireGlob(p, a.u, a.v, false);
  }
  if (keyHit('KeyE', 'ShiftLeft', 'ShiftRight') || (!mouseScheme && input.rclick) || (mouseScheme && (input.wheel || input.mclick))) useItem(p);
  return ctl;
}

function updateAim(p, dt) {
  const a = world.aim;
  const D = 60;
  const useMouse = input.mouseIn && (game.scheme === 'mouse' || input.lastDevice === 'mouse');
  a.lock = null;
  if (useMouse) {
    a.x = input.mx; a.y = input.my;
    // assist: snap to any rival close to the crosshair
    let best = null;
    for (const o of world.racers) {
      if (o === p) continue;
      const dz = relDz(o.dist);
      if (dz < 4 || dz > 120) continue;
      projectDz(dz, o.u, o.v, PT);
      const d = Math.hypot(PT.x - a.x, PT.y - a.y);
      if (d < 60 && (!best || d < best.d)) best = { o, d };
    }
    if (best) {
      a.lock = best.o;
      const tt = gap(p.dist, best.o.dist) / CFG.globSpeed;
      a.u = best.o.u + best.o.vu * tt; a.v = best.o.v;
    } else {
      const q = unproject(D + CFG.camBack, a.x, a.y);
      a.u = q.u; a.v = q.v;
    }
  } else {
    const t = aimTargetFor(p);
    if (t) { a.lock = t.o; a.u = t.u; a.v = t.v; }
    else { a.u = p.u; a.v = p.v + 0.6; }
    const dz = a.lock ? relDz(a.lock.dist) : 40;
    projectDz(Math.max(3, dz), a.u, a.v, PT);
    a.x = damp(a.x, PT.x, 18, dt); a.y = damp(a.y, PT.y, 18, dt);
  }
  a.lockT = a.lock ? a.lockT + dt : 0;
}

// ============================================================================================
// CAMERA — chase-cockpit: lags the craft, banks with steering, widens while boosting, shakes
// ============================================================================================
function updateCamera(dt) {
  const w = world, p = w.player;
  w.camU = damp(w.camU, p.u, CFG.camFollowU, dt);
  w.camV = damp(w.camV, p.v + CFG.camUp, CFG.camFollowV, dt);
  w.camRoll = damp(w.camRoll, -clamp(p.vu / CFG.latMax, -1, 1) * 5 * Math.PI / 180, 8, dt);
  w.camF = damp(w.camF, p.boostT > 0 ? CFG.focalBoost : CFG.focal, 5, dt);
  w.camHz = damp(w.camHz, CFG.horizon + clamp(p.vv * 1.2, -22, 22), 6, dt);
}
function applyCamera(sOverride, vOverride) {
  const w = world, p = w.player;
  cam.roll = w.camRoll; cam.f = w.camF; cam.hz = w.camHz;
  const sh = w.shake;
  cam.ox = sh ? (rand() * 2 - 1) * sh : 0; cam.oy = sh ? (rand() * 2 - 1) * sh : 0;
  setCamera(sOverride != null ? sOverride : p.dist - CFG.camBack, w.camU, vOverride != null ? vOverride : w.camV);
}

// ============================================================================================
// RENDER_RACE — one depth-sorted draw list per frame, then the player's craft and screen FX
// ============================================================================================
function drawRival(c, r, dz) {
  projectDz(dz, r.u, r.v, PT);
  const size = clamp(PT.k * 3.0, 6, 380);   // drawn larger than the 1.4 u hitbox so racers read at a glance
  const lvl = fogLevel(dz);
  const blink = r.invuln > 0 && Math.floor(world.t * 12) % 2 === 0;
  drawRacerArt(c, r.def, PT.x, PT.y, size, {
    flap: r.flapAnim, stun: r.stun > 0, goo: r.goop > 0, shield: r.shield > 0, ghost: r.ghost > 0,
    splats: r.splats, color: GREYS[lvl], roll: cam.roll + r.vu * 0.02, alpha: blink ? 0.45 : 1,
  });
  const npx = clamp(size * 0.045, 1, 6);
  const ny = PT.y - size * 0.62 - npx * 8;
  if (dz < 110) world.tags.push({ dz, x: PT.x, y: ny, px: npx, text: String(r.idx + 1), color: GREYS[lvl], place: world.attract ? null : r.place });
  const b = world.barks.find((bb) => bb.r === r);
  if (b && dz < 90) {
    const tw = textWidth(b.text, 2) + 14;
    const bx = PT.x - tw / 2, by = ny - 28;
    c.fillStyle = '#fff'; c.fillRect(bx, by, tw, 22);
    c.beginPath(); c.moveTo(PT.x - 5, by + 22); c.lineTo(PT.x + 5, by + 22); c.lineTo(PT.x, by + 30); c.fill();
    blockText(c, b.text, PT.x, by + 4, 2, { align: 'center', color: '#000' });
  }
}

function drawGlob(c, g, dz) {
  projectDz(dz, g.u, g.v, PT);
  const r = Math.max(2, PT.k * g.r);
  gooBlob(c, PT.x, PT.y, r, g.seed, world.t);
  c.fillStyle = GOO_C;
  for (let i = 1; i <= 3; i++) {
    const d2 = dz - i * 0.9;
    if (d2 < CFG.near) break;
    projectDz(d2, g.u - g.vu * i * 0.006, g.v - g.vv * i * 0.006, PT2);
    const rr = Math.max(1.5, PT2.k * g.r * (0.55 - i * 0.12));
    c.fillRect(PT2.x - rr / 2, PT2.y - rr / 2, rr, rr);
  }
  gooBlob(c, PT.x - r * 0.3, PT.y - r * 0.3, r * 0.22, g.seed + 1, world.t, '#eaffdc');
}

function renderWorld(c) {
  const w = world, T = TRACK, p = w.player;
  const nb = !w.attract && w.state !== 'done' ? nextBlocker(p) : null;
  w.nextTh = nb ? nb.th : null;
  w.tags = [];
  drawSky(c, T);
  drawCorridor(c, T);
  const list = [];
  queueThings(T, list, w.t);
  drawZones(c, T, list);
  if (T.scenery.length) drawScenery(c, T, list);
  for (const r of w.racers) {
    if (r === p) continue;
    const dz = relDz(r.dist);
    if (dz < (w.attract ? 9 : CFG.near) || dz > CFG.far) continue;   // the attract camera keeps clear of the pack
    list.push({ dz, draw: drawRival, o: r });
  }
  for (const g of w.globs) { const dz = relDz(g.dist); if (dz > CFG.near + 0.5 && dz < CFG.far) list.push({ dz, draw: drawGlob, o: g }); }
  for (const e of w.ents) { const dz = relDz(e.dist); if (dz > CFG.near + 0.5 && dz < CFG.far) list.push({ dz, draw: drawEnt, o: e }); }
  for (const pt of w.parts) { const dz = relDz(pt.dist); if (dz > CFG.near + 0.3 && dz < 120) list.push({ dz, draw: drawPart, o: pt }); }
  if (nb) list.push({ dz: nb.dz - 0.05, draw: drawPathMarker, o: nb });
  list.sort((a, b) => b.dz - a.dz);
  for (const it of list) it.draw(c, it.o, it.dz, it);
  drawTags(c);
}

// Rival number tags, nearest first; a tag that would overlap a nearer one is skipped.
function drawTags(c) {
  const placed = [];
  const tags = world.tags.sort((a, b) => a.dz - b.dz);
  let ordinals = 0;
  for (const t of tags) {
    const w = textWidth(t.text, t.px) + t.px * 2, h = t.px * 9;
    const opx = Math.max(1, t.px * 0.5);
    const withOrd = t.place != null && ordinals < 2 && t.dz < 60;
    const ow = withOrd ? textWidth(ORD[t.place], opx) + 4 : 0;
    const box = [t.x - w / 2, t.y - t.px, w + ow, h];
    if (placed.some((b) => box[0] < b[0] + b[2] && b[0] < box[0] + box[2] && box[1] < b[1] + b[3] && b[1] < box[1] + box[3])) continue;
    placed.push(box);
    blockText(c, t.text, t.x, t.y, t.px, { align: 'center', color: t.color, outline: t.px * 0.6 });
    if (withOrd) {
      ordinals++;
      blockText(c, ORD[t.place], t.x + w / 2 + 2, t.y + t.px * 3, opx, { color: t.color, outline: 1 });
    }
  }
}

// The goal cue on the next wall: what it is and how far.
const CUE_WORDS = { gate: 'FLY THROUGH', pillars: 'SLALOM', rotor: 'SPINNER', laser: 'DARK HALF', ball: 'DODGE', blocks: 'SHOOT OR DODGE' };
function drawNextCue(c, nb, dz) {
  const th = nb.th;
  if (nb.ahead < 10 || nb.ahead > 140) return;
  const S = slabAt(dz);
  let u = 0, v = CFG.ceil - 1.2;
  if (th.kind === 'gate') { u = gateCentreU(th, world.t); v = Math.min(CFG.ceil - 0.6, th.v + th.h / 2 + 0.5); }
  else if (th.kind === 'rotor') { u = th.u; v = Math.min(CFG.ceil - 0.6, th.v + th.len + 0.5); }
  const word = th.kind === 'rotor' && th.jam > 0 ? 'JAMMED' : CUE_WORDS[th.kind];
  const px = clamp(S.k * 0.075, 2, 4);
  blockText(c, word + ' ' + Math.round(nb.ahead) + 'M', sx(S, u, v), sy(S, u, v) - px * 8, px, { align: 'center', color: GOO_C, outline: px * 0.7 });
}

// The next wall-like thing the player will cross, and how far ahead it is.
function nextBlocker(p) {
  const T = TRACK, n = T.things.length;
  let idx = p.ti, base = p.tBase;
  for (let k = 0; k < 12 && n; k++) {
    const th = T.things[idx];
    const ahead = base + th.s - p.dist;
    if (ahead > 150) return null;
    if (th.kind === 'gate' || th.kind === 'pillars' || th.kind === 'rotor' || th.kind === 'laser' || th.kind === 'blocks' || th.kind === 'ball') {
      return { th, dz: ahead + CFG.camBack, ahead };
    }
    idx++; if (idx >= n) { idx = 0; base += T.L; }
  }
  return null;
}
// Flight-path marker: where you would cross the next wall if you held your line.
function drawPathMarker(c, nb, dz) {
  const p = world.player;
  if (dz < 6) return;
  drawNextCue(c, nb, dz);
  const tArrive = world.t + nb.ahead / Math.max(20, p.speed);
  const hit = p.ghost <= 0 && thingBlocks(nb.th, p.u, p.v, tArrive) === 'bonk';
  if (hit && Math.floor(world.t * 8) % 2) return;
  projectDz(dz, p.u, p.v, PT);
  const s = clamp(PT.k * 0.55, 7, 18);
  c.beginPath();

function fmtTime(t) {
  if (!(t >= 0)) t = 0;
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
}
function drawItemIcon(c, it, x, y, size) {
  const s = size;

  c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = Math.max(2, s * 0.08); c.lineJoin = 'round';
  switch (it) {

      c.beginPath(); c.arc(-s * 0.15, 0, s * 0.22, 0, TAU); c.arc(s * 0.12, -s * 0.08, s * 0.2, 0, TAU); c.arc(s * 0.15, s * 0.15, s * 0.16, 0, TAU); c.stroke();
      c.beginPath(); c.moveTo(-s * 0.38, 0); c.lineTo(-s * 0.48, -s * 0.12); c.lineTo(-s * 0.48, s * 0.12); c.closePath(); c.fill();
      break;
    case 'bazooka':
      gooBlob(c, s * 0.08, 0, s * 0.3, 4, 0);
      c.fillRect(-s * 0.45, -s * 0.05, s * 0.2, s * 0.1); c.fillRect(-s * 0.42, -s * 0.18, s * 0.12, s * 0.08); c.fillRect(-s * 0.42, s * 0.1, s * 0.12, s * 0.08);
      break;
    case 'sock':
      c.beginPath(); c.moveTo(-s * 0.15, -s * 0.38); c.lineTo(s * 0.1, -s * 0.38); c.lineTo(s * 0.1, s * 0.1); c.lineTo(s * 0.35, s * 0.1); c.lineTo(s * 0.35, s * 0.3); c.lineTo(-s * 0.15, s * 0.3); c.closePath(); c.stroke();
      c.beginPath(); c.moveTo(-s * 0.15, -s * 0.2); c.lineTo(-s * 0.42, -s * 0.36); c.moveTo(s * 0.1, -s * 0.2); c.lineTo(s * 0.4, -s * 0.36); c.stroke();
      break;
    case 'balloon':
      gooBlob(c, 0, -s * 0.06, s * 0.28, 9, 0, '#000'); c.strokeStyle = GOO_C; c.stroke();
      c.beginPath(); c.moveTo(0, s * 0.22); c.lineTo(0, s * 0.42); c.strokeStyle = '#fff'; c.stroke();
      break;
    case 'bubble':
      c.setLineDash([s * 0.12, s * 0.08]); c.beginPath(); c.arc(0, 0, s * 0.34, 0, TAU); c.stroke(); c.setLineDash([]);
      c.fillRect(-s * 0.18, -s * 0.18, s * 0.08, s * 0.08);
      break;
    case 'ghost':
      c.setLineDash([s * 0.1, s * 0.07]);
      c.beginPath(); c.moveTo(-s * 0.25, s * 0.3); c.lineTo(-s * 0.25, -s * 0.05); c.arc(0, -s * 0.05, s * 0.25, Math.PI, 0); c.lineTo(s * 0.25, s * 0.3); c.lineTo(s * 0.12, s * 0.2); c.lineTo(0, s * 0.3); c.lineTo(-s * 0.12, s * 0.2); c.closePath(); c.stroke();
      c.setLineDash([]); c.fillRect(-s * 0.12, -s * 0.1, s * 0.07, s * 0.07); c.fillRect(s * 0.05, -s * 0.1, s * 0.07, s * 0.07);
      break;
    case 'geyser':
      for (const dx of [-0.25, 0, 0.25]) gooBlob(c, dx * s, -s * 0.15 - Math.abs(dx) * -s * 0.2, s * 0.12, 3 + dx * 10, 0);
      c.fillStyle = GOO_C; c.fillRect(-s * 0.3, s * 0.2, s * 0.6, s * 0.12);

}

// ============================================================================================
// CUP — grand prix progression: points, retry tokens, standings, trophies and the mirror unlock
// ============================================================================================
function startCup(mode) {
  game.cup = { mode, race: 0, tracks: mode === 'quick' ? [game.quickTrack] : [0, 1, 2, 3, 4], pts: [0, 0, 0, 0, 0, 0, 0, 0], tokens: CFG.tokens, score: 0, lastWins: null, splats: 0, bestLap: 0 };
}
function cupStandings() {
  const cup = game.cup;
  return [0, 1, 2, 3, 4, 5, 6, 7].sort((a, b) => (cup.pts[b] - cup.pts[a]) || ((cup.lastWins ? cup.lastWins.indexOf(a) : a) - (cup.lastWins ? cup.lastWins.indexOf(b) : b)));
}
function finishCup() {
  const st = cupStandings();
  const place = st.indexOf(game.racer);
  const key = (game.mirror ? 'regloop' : 'gloop') + ':' + game.diff;
  if (place < 3 && (!save.trophies[key] || place + 1 < save.trophies[key])) save.trophies[key] = place + 1;
  game.cup.unlocked = place < 3 && !save.unlockedMirror;
  if (place < 3) save.unlockedMirror = true;
  game.cup.newBestCup = game.cup.score > save.bestCup;
  if (game.cup.newBestCup) save.bestCup = game.cup.score;
  writeSave();
  return place;
}

// SCENES — title, select, how-to, intro, race (+pause), results, standings, podium, game over
// ============================================================================================
const UI = { rects: new Map() };
function uiRect(id, x, y, w, h) { UI.rects.set(id, [x, y, w, h]); }
function uiOver(id) {
  const r = UI.rects.get(id);
  return !!r && input.mouseIn && input.mx >= r[0] && input.mx <= r[0] + r[2] && input.my >= r[1] && input.my <= r[1] + r[3];
}
function menuNav(state, ids) {
  const n = ids.length;
  if (keyHit('ArrowUp', 'KeyW')) { state.i = (state.i + n - 1) % n; sfx.uiMove(); }
  if (keyHit('ArrowDown', 'KeyS')) { state.i = (state.i + 1) % n; sfx.uiMove(); }
  if (input.moved) for (let k = 0; k < n; k++) if (uiOver(ids[k]) && state.i !== k) { state.i = k; sfx.uiMove(); }
  if (keyHit('Enter', 'Space', 'NumpadEnter')) return state.i;
  if (input.click) for (let k = 0; k < n; k++) if (uiOver(ids[k])) { state.i = k; return k; }
  return -1;
}
function drawButton(c, id, label, x, y, w, h, selected, opts) {

  const px = o.px || 3;
  blockText(c, label, x + w / 2, y + h / 2 - px * 3.5, px, { align: 'center', color: selected ? '#000' : o.dim ? '#585858' : '#fff' });

  }
}
function smallText(c, text, x, y, size, color, align) {

  c.fillStyle = color || '#909090'; c.textAlign = align || 'left'; c.textBaseline = 'top';

function goTo(name, setup) {
  if (game.wipe) return;   // one transition at a time
  if (SHOT) { if (setup) setup(); enterScene(name); return; }

}
function enterScene(name) {
  game.scene = name; game.sceneT = 0; game.paused = false;
  const sc = SCENES[name];
  if (sc.enter) sc.enter();
  canvas.style.cursor = name === 'race' ? 'none' : 'default';
  const st = document.getElementById('status');
  if (st) st.textContent = 'GOO PRIX: ' + name;
}
function updateWipe(dt) {
  const wp = game.wipe;
  if (!wp) return;
  wp.t += dt;
  if (wp.t >= 0.3 && !wp.switched) { wp.switched = true; if (wp.setup) wp.setup(); enterScene(wp.name); }
  if (wp.t >= 0.62) game.wipe = null;
}
function drawWipe(c) {
  const wp = game.wipe;
  if (!wp) return;
  const p = wp.t < 0.3 ? smooth01(wp.t / 0.3) : 1 - smooth01((wp.t - 0.32) / 0.3);
  const bands = 18, bh = H / bands;
  for (let i = 0; i < bands; i++) {
    const h = clamp(p * 1.25 - (i % 3) * 0.08, 0, 1) * bh;
    if (h <= 0) continue;
    c.fillStyle = '#000'; c.fillRect(0, i * bh, W, h);
    c.fillStyle = GOO_C;
    for (let x = (i * 37) % 80; x < W; x += 80) c.fillRect(x, i * bh + h - 3, 10, 3 + (x % 7));
  }
}

function startRaceScene(trackIdx) {
  reseed(1000 + trackIdx * 31 + (game.cup ? game.cup.race * 7 : 0) + Math.floor(rand() * 1000));
  setupRace(trackIdx);
  MUSIC.play(TRACK.def.song);
}

function resultOptions(res, cup) {
  const opts = [];
  if (cup.mode === 'quick') {
    opts.push({ id: 'retry', label: 'RACE AGAIN', go: () => goTo('intro', () => startRaceScene(res.trackIdx)) });
    opts.push({ id: 'title', label: 'TITLE', go: () => goTo('title') });
    return opts;
  }
  if (res.dnq) {
    if (cup.tokens > 0) opts.push({ id: 'retry', label: 'RETRY (' + cup.tokens + ' LEFT)', go: () => { cup.tokens--; goTo('intro', () => startRaceScene(res.trackIdx)); } });
    else opts.push({ id: 'over', label: 'GAME OVER', go: () => goTo('gameover') });
    opts.push({ id: 'title', label: 'QUIT', go: () => goTo('title') });
    return opts;
  }
  if (cup.race < cup.tracks.length - 1) opts.push({ id: 'next', label: 'STANDINGS', go: () => goTo('standings') });
  else opts.push({ id: 'next', label: 'TO THE PODIUM', go: () => goTo('podium') });
  return opts;
}

// ---- PAUSE overlay inside the race
const PAUSE_ITEMS = ['resume', 'restart', 'scheme', 'quit'];
function togglePause() {
  if (game.scene !== 'race') return;
  game.paused = !game.paused;
  game.pauseMenu.i = 0;
  MUSIC.duck = game.paused ? 0.45 : 1;
  sfx.uiMove();
}
function onBlurPause() { if (game.scene === 'race' && !game.paused && !SHOT) togglePause(); }
function restartCost() { return game.cup && game.cup.mode === 'cup' && world.player.dist > TRACK.L; }
function restartRace() {
  if (game.scene !== 'race' || game.wipe) return;
  if (restartCost()) { if (game.cup.tokens <= 0) { popup('NO RETRIES LEFT', 'mid'); return; } game.cup.tokens--; }
  goTo('intro', () => startRaceScene(world.trackIdx));
}
function pauseUpdate() {
  const sel = menuNav(game.pauseMenu, PAUSE_ITEMS);
  const cur = PAUSE_ITEMS[game.pauseMenu.i];
  if (cur === 'scheme' && keyHit('ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD')) setScheme(game.scheme === 'keys' ? 'mouse' : 'keys');
  if (sel < 0) return;
  const id = PAUSE_ITEMS[sel];
  sfx.uiSelect();
  if (id === 'resume') togglePause();
  else if (id === 'restart') { game.paused = false; MUSIC.duck = 1; restartRace(); }
  else if (id === 'scheme') setScheme(game.scheme === 'keys' ? 'mouse' : 'keys');
  else if (id === 'quit') { game.paused = false; MUSIC.duck = 1; goTo('title'); }
}
function drawPause(c) {
  dim(c, 0.7);
  blockText(c, 'PAUSED', W / 2, 150, 10, { align: 'center', color: '#fff', shadow: 6 });
  const labels = {
    resume: 'RESUME',
    restart: 'RESTART RACE' + (restartCost() ? ' (1 RETRY)' : ''),
    scheme: 'CONTROLS: ' + (game.scheme === 'mouse' ? 'MOUSE' : 'KEYS'),
    quit: 'QUIT TO TITLE',
  };
  PAUSE_ITEMS.forEach((id, i) => drawButton(c, id, labels[id], W / 2 - 220, 290 + i * 60, 440, 48, game.pauseMenu.i === i, { arrows: id === 'scheme' }));
  blockText(c, game.scheme === 'mouse'
    ? 'MOUSE: CROSSHAIR STEERS  CLICK FLAP  HOLD RIGHT DIVE  HOVER A RIVAL TO FIRE  WHEEL ITEM'
    : 'KEYS: SPACE FLAP  A/D STEER  S DIVE  F OR CLICK GOO  E ITEM  R RESTART  M MUTE', W / 2, 560, 2, { align: 'center', color: '#909090' });
}

  const n = Math.round(seconds / DT);

}

// The gate with the most going on in front of it: cubes, coins and rings, more gates behind.
function showcaseGate() {
  const T = TRACK;
  let best = null;
  for (const th of T.things) {
    if (th.kind !== 'gate' || th.paddle || th.slide) continue;
    let score = 0;
    for (const o of T.things) {
      const d = wrap(o.s - (th.s - 42), T.L);
      if (d > 220) continue;
      if (d > 8 && d < 60) { if (o.kind === 'cube') score += 3; if (o.kind === 'coin') score += 1; if (o.kind === 'ring') score += 2; }
      if (d > 60 && (o.kind === 'gate' || o.kind === 'pillars')) score += 1;
    }
    if (!best || score > best.score) best = { th, score };
  }
  return best.th;
}

canvas.addEventListener('wheel', (e) => { if (game.scene === 'race') { input.wheel = true; e.preventDefault(); } }, { passive: false });

function tick(dt) {
  game.sceneT += dt;
  if (game.wipe) {
    updateWipe(dt);
    if ((game.scene === 'title' || game.scene === 'select' || game.scene === 'howto') && world) { raceStep(dt); updateCamera(dt); }
    return;
  }
  SCENES[game.scene].update(dt);
}

function render() {
  UI.rects.clear();
  ctx.save();
  SCENES[game.scene].draw(ctx);
  ctx.restore();
  drawWipe(ctx);
}

let lastTs = 0, acc = 0;
function loop(ts) {
  const now = ts / 1000;
  const dt = lastTs ? Math.min(0.1, now - lastTs) : DT;
  lastTs = now;
  let scale = 1;
  if (game.scene === 'race' && world && world.slowmo > 0 && !game.paused) { world.slowmo -= dt; scale = 0.35; }
  acc += dt * scale;
  let steps = 0;
  while (acc >= DT && steps < 5) {
    tick(DT);
    acc -= DT; steps++;
    if (steps === 1) { endInputFrame(); input.wheel = false; input.mclick = false; }
  }
  if (steps === 5) acc = 0;
  render();
  requestAnimationFrame(loop);
}

const frameEl = document.getElementById('frame');
function layout() {
  if (SHOT) {
    frameEl.style.width = innerWidth + 'px'; frameEl.style.height = innerHeight + 'px';
    return;
  }
  const fs = document.fullscreenElement === frameEl;
  const availW = innerWidth - (fs ? 0 : 32);
  const availH = innerHeight - (fs ? 0 : 44 + 16 + 12 + 40 + 12 + 22);
  const w = Math.max(320, Math.floor(Math.min(availW, availH * 16 / 9)));
  const h = Math.floor(w * 9 / 16);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  if (fs) { frameEl.style.width = '100%'; frameEl.style.height = '100%'; frameEl.style.display = 'grid'; frameEl.style.placeItems = 'center'; }
  else { frameEl.style.width = w + 'px'; frameEl.style.height = h + 'px'; frameEl.style.display = 'block'; }
}

function wireShell() {
  const btn = (id, fn) => {
    const b = document.getElementById(id);
    b.addEventListener('click', () => { AU.resume(); fn(); b.blur(); canvas.focus(); });
  };
  btn('b-restart', () => { if (game.scene === 'race') restartRace(); else if (game.scene !== 'title') goTo('title'); });
  btn('b-pause', () => togglePause());
  btn('b-sound', () => AU.setMuted(!save.muted));
  btn('b-full', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (frameEl.requestFullscreen) frameEl.requestFullscreen();
  });
  document.addEventListener('fullscreenchange', layout);
  const use = document.getElementById('i-sound-use');
  if (use) use.setAttribute('href', save.muted ? '#i-mute' : '#i-sound');
}

function boot() {
  loadSave();
  game.diff = clamp(save.difficulty | 0, 0, 2);
  game.racer = clamp(save.racer | 0, 0, 7);
  game.scheme = save.scheme === 'mouse' ? 'mouse' : 'keys';
  layout();
  window.addEventListener('resize', layout);
  if (SHOT) { runShot(SHOT); return; }
  wireShell();
  enterScene('title');
  canvas.focus();
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
