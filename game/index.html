<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOO PRIX</title>
<meta name="description" content="GOO PRIX: a flap-and-splat score attack. Five worlds that each bend the rules (rhythm, blizzards, flipped gravity, zero-G lock-ons), twelve Mix-in perks to draft between them, then a chrome cleaning-robot boss to make filthy, and an Endless mode.">
<style>
  :root {
    --page: #2a2a2f;
    --frame-edge: #3a3a40;
    --ink: #f4f4f0;
    --dim: #8a8a92;
    --gold: #f5c542;
    --bar: #1f1f23;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--page); color: var(--ink);
    font: 600 13px/1.35 "Chakra Petch", "Bahnschrift", "DIN Alternate", "Avenir Next Condensed", "Trebuchet MS", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #shell {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 44px 16px 16px;
  }
  #logo {
    position: fixed; top: 12px; left: 16px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: .18em; color: var(--ink); user-select: none;
  }
  #logo svg { width: 22px; height: 22px; display: block; }
  #frame {
    position: relative; background: #000;
    border-radius: 18px; border: 1px solid var(--frame-edge);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
    overflow: hidden;
  }
  #game { display: block; width: 100%; height: 100%; cursor: crosshair; outline: none; }
  #bar {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 6px; border: 1px solid var(--gold); border-radius: 10px; background: var(--bar);
  }
  #bar button {
    width: 34px; height: 30px; border: 0; border-radius: 7px; padding: 0;
    background: transparent; color: var(--dim); cursor: pointer;
    display: grid; place-items: center; transition: color .12s, background .12s;
  }
  #bar button:hover, #bar button:focus-visible { color: #fff; background: #2c2c32; outline: none; }
  #bar button svg { width: 16px; height: 16px; fill: currentColor; }
  #caption { color: var(--dim); font-size: 12px; text-align: center; max-width: 900px; user-select: none; }
  #caption b { color: var(--ink); font-weight: 600; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Screenshot mode (?shot=...): the canvas fills the window, nothing else is drawn. */
  body.shot #logo, body.shot #bar, body.shot #caption { display: none; }
  body.shot #shell { padding: 0; gap: 0; }
  body.shot #frame { border: 0; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<svg hidden>
  <symbol id="i-restart" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-3a6 6 0 1 1-1.76-4.24L13 11h8V3l-2.64 2.64A8.97 8.97 0 0 0 12 3Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M5 3h5v18H5zM14 3h5v18h-5z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M13 2v20l-7-5H1V7h5l7-5Zm3 5.5a6 6 0 0 1 0 9V14a3 3 0 0 0 0-4V7.5Zm0-5a11 11 0 0 1 0 19v-2.6a8.5 8.5 0 0 0 0-13.8V2.5Z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M13 2v20l-7-5H1V7h5l7-5Zm4.4 6.2L20 10.8l2.6-2.6 1.4 1.4-2.6 2.6 2.6 2.6-1.4 1.4-2.6-2.6-2.6 2.6-1.4-1.4 2.6-2.6-2.6-2.6 1.4-1.4Z"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M2 2h8v3H5v5H2V2Zm12 0h8v8h-3V5h-5V2ZM2 14h3v5h5v3H2v-8Zm17 0h3v8h-8v-3h5v-5Z"/></symbol>
</svg>
<div id="logo" aria-hidden="true">
  <svg viewBox="0 0 22 22"><rect x="1" y="1" width="20" height="20" rx="5" fill="#000" stroke="#f5c542" stroke-width="1.5"/><path d="M6 6h10v3H9v4h4v-1h-2V10h5v6H6Z" fill="#f4f4f0"/><circle cx="16.5" cy="18.2" r="1.6" fill="#f5c542"/></svg>
  GOO PRIX
</div>
<div id="shell">
  <div id="frame"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="GOO PRIX: a first-person flying kart race. Flap through the windows, steer, and splat the other racers with goo."></canvas></div>
  <div id="bar" role="toolbar" aria-label="Game controls">
    <button id="b-restart" title="Restart race (R)" aria-label="Restart race"><svg><use href="#i-restart"/></svg></button>
    <button id="b-pause" title="Pause (Esc)" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
    <button id="b-sound" title="Sound on/off (M)" aria-label="Sound on or off"><svg><use id="i-sound-use" href="#i-sound"/></svg></button>
    <button id="b-full" title="Fullscreen" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
  </div>
  <div id="caption">A flap-and-splat score attack: 5 worlds that each bend the rules, 12 Mix-ins to draft, 8 ships, the boss Mister Spotless, and Endless Slop. &nbsp;·&nbsp; <b>↑</b> flap &nbsp; <b>← →</b> steer &nbsp; <b>↓</b> dive &nbsp; <b>SPACE</b> shoot goo &nbsp; <b>X</b> item</div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<!-- the game: screens and rules first, then the engine; plain scripts sharing one scope -->
