<script>
'use strict';

// ============================================================================================
// RNG — seeded random numbers, so tracks, AI noise and screenshot poses are reproducible
// ============================================================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(1);
function reseed(seed) { rand = mulberry32(seed); }
function rnd(lo, hi) { return lo + (hi - lo) * rand(); }
function rndInt(lo, hi) { return Math.floor(rnd(lo, hi + 1)); }
function pick(list) { return list[Math.floor(rand() * list.length)]; }
function weighted(table) {
  // table: [[value, weight], ...]
  let total = 0;
  for (const row of table) total += row[1];
  let r = rand() * total;
  for (const row of table) { r -= row[1]; if (r <= 0) return row[0]; }
  return table[table.length - 1][0];
}

// ============================================================================================
// MATH — small helpers shared by physics, camera and drawing
// ============================================================================================
const TAU = Math.PI * 2;
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function approach(v, target, rate) { return v < target ? Math.min(target, v + rate) : Math.max(target, v - rate); }
function damp(a, b, lambda, dt) { return lerp(a, b, 1 - Math.exp(-lambda * dt)); }
function smooth01(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function easeOutBack(t) { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; }
function wrap(v, m) { return ((v % m) + m) % m; }

// ============================================================================================
// SAVE — best times, trophies and settings in localStorage (silently skipped when blocked)
// ============================================================================================
const SAVE_KEY = 'gooprix.v1';
const save = {
  bestLap: {},        // `${track}:${difficulty}` -> seconds
  bestRace: {},       // `${track}:${difficulty}` -> seconds
  bestCup: 0,         // best cup splat score
  trophies: {},       // `${cup}:${difficulty}` -> 1 gold, 2 silver, 3 bronze
  unlockedMirror: false,
  racer: 0,
  difficulty: 1,
  muted: false,
  wallet: 0,
};
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) Object.assign(save, JSON.parse(raw));
  } catch (err) { /* private mode or blocked storage: play without saving */ }
}
function writeSave() {
  if (SHOT) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (err) { /* ignore */ }
}

// ============================================================================================
// AUDIO_CORE — WebAudio context, buses and the envelope/noise primitives every sound uses
// ============================================================================================
const AU = {
  ctx: null, master: null, sfx: null, music: null, noiseBuf: null, ready: false,
  init() {
    if (this.ctx || SHOT) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    this.ctx = ctx;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4;
    comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(ctx.destination);
    this.master = ctx.createGain();
    this.master.gain.value = save.muted ? 0 : 0.8;
    this.master.connect(comp);
    this.sfx = ctx.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
    this.music = ctx.createGain(); this.music.gain.value = 0.42; this.music.connect(this.master);
    const len = ctx.sampleRate * 1.5;
    this.noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = this.noiseBuf.getChannelData(0);
    const nr = mulberry32(99);
    for (let i = 0; i < len; i++) data[i] = nr() * 2 - 1;
    this.ready = true;
  },
  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    if (typeof MUSIC !== 'undefined') MUSIC.wake();
  },
  setMuted(m) {
    save.muted = m; writeSave();
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.8, this.ctx.currentTime, 0.02);
    const use = document.getElementById('i-sound-use');
    if (use) use.setAttribute('href', m ? '#i-mute' : '#i-sound');
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
};

// One oscillator with an exponential pitch glide and a quick attack / exponential decay.
function tone(type, f0, f1, dur, vol, opts) {
  if (!AU.ready) return;
  const o = opts || {};
  const ctx = AU.ctx;
  const t = o.when != null ? o.when : ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(1, f0), t);
  if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  if (o.detune) osc.detune.value = o.detune;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + (o.attack || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = osc;
  if (o.filter) {
    const f = ctx.createBiquadFilter();
    f.type = o.filter; f.frequency.value = o.cutoff || 1200; f.Q.value = o.q || 1;
    if (o.cutoffEnd) f.frequency.exponentialRampToValueAtTime(o.cutoffEnd, t + dur);
    node.connect(f); node = f;
  }
  node.connect(g);
  g.connect(o.bus || AU.sfx);
  osc.start(t); osc.stop(t + dur + 0.02);
}

// A filtered burst of white noise with a swept filter: puffs, splats, snares, wind.
function noise(dur, vol, filterType, f0, f1, opts) {
  if (!AU.ready) return;
  const o = opts || {};
  const ctx = AU.ctx;
  const t = o.when != null ? o.when : ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = AU.noiseBuf;
  const f = ctx.createBiquadFilter();
  f.type = filterType; f.Q.value = o.q || 1.2;
  f.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + (o.attack || 0.003));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(o.bus || AU.sfx);
  src.start(t, rand() * 1.0); src.stop(t + dur + 0.02);
}

// ============================================================================================
// BLOCKFONT — the chunky Pong-scoreboard lettering: a 5x7 glyph table drawn as solid blocks
// ============================================================================================
const GLYPHS = {
  'A': [14, 17, 17, 31, 17, 17, 17], 'B': [30, 17, 17, 30, 17, 17, 30], 'C': [14, 17, 16, 16, 16, 17, 14],
  'D': [28, 18, 17, 17, 17, 18, 28], 'E': [31, 16, 16, 30, 16, 16, 31], 'F': [31, 16, 16, 30, 16, 16, 16],
  'G': [14, 17, 16, 23, 17, 17, 15], 'H': [17, 17, 17, 31, 17, 17, 17], 'I': [14, 4, 4, 4, 4, 4, 14],
  'J': [7, 2, 2, 2, 2, 18, 12], 'K': [17, 18, 20, 24, 20, 18, 17], 'L': [16, 16, 16, 16, 16, 16, 31],
  'M': [17, 27, 21, 21, 17, 17, 17], 'N': [17, 17, 25, 21, 19, 17, 17], 'O': [14, 17, 17, 17, 17, 17, 14],
  'P': [30, 17, 17, 30, 16, 16, 16], 'Q': [14, 17, 17, 17, 21, 18, 13], 'R': [30, 17, 17, 30, 20, 18, 17],
  'S': [15, 16, 16, 14, 1, 1, 30], 'T': [31, 4, 4, 4, 4, 4, 4], 'U': [17, 17, 17, 17, 17, 17, 14],
  'V': [17, 17, 17, 17, 17, 10, 4], 'W': [17, 17, 17, 21, 21, 21, 10], 'X': [17, 17, 10, 4, 10, 17, 17],
  'Y': [17, 17, 10, 4, 4, 4, 4], 'Z': [31, 1, 2, 4, 8, 16, 31],
  '0': [14, 17, 19, 21, 25, 17, 14], '1': [4, 12, 4, 4, 4, 4, 14], '2': [14, 17, 1, 2, 4, 8, 31],
  '3': [31, 2, 4, 2, 1, 17, 14], '4': [2, 6, 10, 18, 31, 2, 2], '5': [31, 16, 30, 1, 1, 17, 14],
  '6': [6, 8, 16, 30, 17, 17, 14], '7': [31, 1, 2, 4, 8, 8, 8], '8': [14, 17, 17, 14, 17, 17, 14],
  '9': [14, 17, 17, 15, 1, 2, 12],
  ' ': [0, 0, 0, 0, 0, 0, 0], '!': [4, 4, 4, 4, 4, 0, 4], '?': [14, 17, 1, 2, 4, 0, 4],
  '.': [0, 0, 0, 0, 0, 12, 12], ',': [0, 0, 0, 0, 12, 4, 8], ':': [0, 12, 12, 0, 12, 12, 0],
  '/': [1, 1, 2, 4, 8, 16, 16], '-': [0, 0, 0, 14, 0, 0, 0], '+': [0, 4, 4, 31, 4, 4, 0],
  "'": [4, 4, 8, 0, 0, 0, 0], '%': [24, 25, 2, 4, 8, 19, 3], '#': [10, 10, 31, 10, 31, 10, 10],
  '(': [2, 4, 8, 8, 8, 4, 2], ')': [8, 4, 2, 2, 2, 4, 8], '&': [12, 18, 20, 8, 21, 18, 13],
  '=': [0, 0, 31, 0, 31, 0, 0], '<': [2, 4, 8, 16, 8, 4, 2], '>': [8, 4, 2, 1, 2, 4, 8],
  '_': [0, 0, 0, 0, 0, 0, 31], '*': [0, 4, 21, 14, 21, 4, 0], '"': [10, 10, 0, 0, 0, 0, 0], '·': [0, 0, 0, 4, 0, 0, 0],
  '×': [0, 0, 17, 10, 4, 10, 17], '^': [4, 10, 17, 0, 0, 0, 0], '|': [4, 4, 4, 4, 4, 4, 4],
};

function textWidth(text, px) {
  return text.length ? (text.length * 6 - 1) * px : 0;
}

// Draws text as solid blocks. opts: align ('left'|'center'|'right'), color, alpha,
// skew (italic lean), shadow (dark block offset in px, or 0), outline (dark border in px).
function blockText(ctx, text, x, y, px, opts) {
  const o = opts || {};
  text = String(text).toUpperCase();
  const w = textWidth(text, px);
  const align = o.align || 'left';
  let x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const path = new Path2D();
  for (let i = 0; i < text.length; i++) {
    const g = GLYPHS[text[i]] || GLYPHS['?'];
    const gx = x0 + i * 6 * px;
    for (let row = 0; row < 7; row++) {
      const bits = g[row];
      if (!bits) continue;
      // merge horizontal runs into one rect each
      let col = 0;
      while (col < 5) {
        if (bits & (16 >> col)) {
          let end = col;
          while (end + 1 < 5 && (bits & (16 >> (end + 1)))) end++;
          path.rect(gx + col * px, y + row * px, (end - col + 1) * px, px);
          col = end + 1;
        } else col++;
      }
    }
  }
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.skew) { ctx.translate(x, y + 3.5 * px); ctx.transform(1, 0, -o.skew, 1, 0, 0); ctx.translate(-x, -(y + 3.5 * px)); }
  if (o.shadow) {
    ctx.save(); ctx.translate(o.shadow, o.shadow); ctx.fillStyle = o.shadowColor || '#000'; ctx.fill(path); ctx.restore();
  }
  if (o.outline) {
    ctx.lineJoin = 'miter'; ctx.lineWidth = o.outline * 2; ctx.strokeStyle = o.outlineColor || '#000'; ctx.stroke(path);
  }
  ctx.fillStyle = o.color || '#fff';
  ctx.fill(path);
  ctx.restore();
  return w;
}

// ============================================================================================
// INPUT — keyboard and mouse state with per-frame edge detection, plus the shell's buttons
// ============================================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;

const input = {
  down: new Set(),        // keys held (KeyboardEvent.code)
  hit: new Set(),         // keys pressed since the last frame
  mx: W / 2, my: H / 2,   // mouse in canvas pixels
  mouseIn: false,
  lmb: false, rmb: false,
  click: false, rclick: false,  // pressed since last frame
  moved: false,
  lastDevice: 'keys',
};
const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);

window.addEventListener('keydown', (e) => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  AU.resume();
  input.lastDevice = 'keys';
  if (!e.repeat) input.hit.add(e.code);
  input.down.add(e.code);
});
window.addEventListener('keyup', (e) => { input.down.delete(e.code); });
window.addEventListener('blur', () => { input.down.clear(); input.lmb = input.rmb = false; onBlurPause(); });

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)];
}
canvas.addEventListener('mousemove', (e) => {
  const p = canvasPoint(e);
  input.mx = p[0]; input.my = p[1]; input.mouseIn = true; input.moved = true;
  input.lastDevice = 'mouse';
});
canvas.addEventListener('mouseleave', () => { input.mouseIn = false; });
canvas.addEventListener('mousedown', (e) => {
  AU.resume();
  canvas.focus();
  const p = canvasPoint(e);
  input.mx = p[0]; input.my = p[1];
  input.lastDevice = 'mouse';
  if (e.button === 0) { input.lmb = true; input.click = true; }
  if (e.button === 2) { input.rmb = true; input.rclick = true; }
  e.preventDefault();
});
window.addEventListener('mouseup', (e) => {
  if (e.button === 0) input.lmb = false;
  if (e.button === 2) input.rmb = false;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function keyHit(...codes) { for (const c of codes) if (input.hit.has(c)) return true; return false; }
function keyDown(...codes) { for (const c of codes) if (input.down.has(c)) return true; return false; }
function endInputFrame() { input.hit.clear(); input.click = false; input.rclick = false; input.moved = false; }

// ============================================================================================
// CONFIG — every tuning number in one place (world units: 1 u is about a metre)
// ============================================================================================
const PARAMS = new URLSearchParams(location.search);
const SHOT = PARAMS.get('shot');
const SHOT_SEED = parseInt(PARAMS.get('seed') || '1', 10) || 1;
if (SHOT) document.body.classList.add('shot');

const CFG = {
  halfW: 12, ceil: 14, hit: 0.7,
  gravity: 34, flapV: 11.5, maxFall: 16, diveG: 30, diveMaxFall: 24, flapBuffer: 0.08,
  latAccel: 70, latMax: 16, latDamp: 8, curvePushMax: 5,
  cruise: [54, 60, 66], accel: 40, decel: 70,
  laps: 3, racers: 8,
  focal: 763, focalBoost: 690, horizon: 331, near: 1.2, far: 260,
  camBack: 2.4, camUp: 0.7, camFollowU: 12, camFollowV: 9,
  tank: 100, shotCost: 12, tankRegen: 10, shotCd: 0.2,
  globSpeed: 160, globGrav: 6, globLife: 0.75, globR: 0.5,
  goopMul: 0.7, goopFlap: 0.8, goopTime: 1.3, goopMax: 3,
  bonkMul: 0.35, stun: 0.6, flapLock: 0.35, invuln: 1.2,
  swoopTiers: [[0.35, 1.25, 0.7], [0.8, 1.42, 1.0]], swoopWindow: 0.15,
  ringMul: 1.45, ringTime: 1.2, ringR: 2.2,
  slipMul: 1.12, rocketMul: 1.5,
  rubberBehind: [0.08, 0.12, 0.14], rubberAhead: [0.12, 0.08, 0.04],
  points: [15, 12, 10, 8, 6, 4, 2, 1],
  windowAdj: [0.8, 0, -0.8],
  aiSkill: [[0.5, 0.66], [0.6, 0.8], [0.72, 0.9]],
  tokens: 3,
};
const DIFFS = ['CHILL', 'ZESTY', 'FERAL'];
const GREYS = ['#ffffff', '#c8c8c8', '#909090', '#585858', '#303030'];
const GOO_C = '#7cff3a';
const DT = 1 / 60;
const ORD = ['1ST', '2ND', '3RD', '4TH', '5TH', '6TH', '7TH', '8TH'];

// ============================================================================================
// SFX — one small synth recipe per game sound (square, triangle and noise: Pong-flavoured)
// ============================================================================================
const sfx = {
  flap(p) { p = p || 1; noise(0.05, 0.1, 'bandpass', 1800 * p, 900 * p); tone('square', 520 * p, 330 * p, 0.05, 0.045); },
  shoot() { tone('sawtooth', 340, 90, 0.11, 0.09, { filter: 'lowpass', cutoff: 1500 }); noise(0.05, 0.05, 'lowpass', 2400, 600); },
  splat() { noise(0.24, 0.32, 'bandpass', 1500, 180, { q: 2.2 }); tone('triangle', 120, 48, 0.2, 0.3); },
  wallSplat() { noise(0.12, 0.13, 'bandpass', 900, 260, { q: 1.6 }); },

// ============================================================================================
// MUSIC — a tiny look-ahead step sequencer; every track gets its own seeded groove
// ============================================================================================
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], phryg: [0, 1, 3, 5, 7, 8, 10] };
function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function makeSong(seed, bpm, root, scaleName, style) {
  const rng = mulberry32(seed);
  const scale = SCALES[scaleName];
  const prog = style === 'chill' ? [0, 3, 5, 4] : pickFrom(rng, [[0, 5, 3, 4], [0, 3, 4, 3], [0, 6, 5, 4], [0, 4, 5, 3]]);
  const kicks = { four: 'x...x...x...x...', broken: 'x.....x...x..x..', chill: 'x.......x.x.....' };
  const lead = [];
  for (let bar = 0; bar < 2; bar++) {
    for (let i = 0; i < 16; i++) {
      const on = rng() < (i % 4 === 0 ? 0.75 : i % 2 === 0 ? 0.45 : 0.2);
      lead.push(on ? Math.floor(rng() * 5) * (rng() < 0.5 ? 1 : 2) % 7 : -1);
    }
  }
  return {
    bpm, root, scale, prog, lead,
    kick: style === 'chill' ? kicks.chill : style === 'broken' ? kicks.broken : kicks.four,
    snare: style === 'chill' ? '........x.......' : '....x.......x...',
    hat: style === 'chill' ? '..x...x...x...x.' : 'x.xxx.xxx.xxx.xx',
    bass: style === 'chill' ? 'x.......x.......' : pickFrom(rng, ['x..x..x.x..x..x.', 'x.x.x.x.x.x.x.x.', 'x..xx..xx..x.x..']),
  };
}
function pickFrom(rng, list) { return list[Math.floor(rng() * list.length)]; }

const MUSIC = {
  song: null, step: 0, nextTime: 0, timer: null, tempoMul: 1, transpose: 0, duck: 1,
  play(song) {
    this.song = song; this.step = 0; this.tempoMul = 1; this.transpose = 0;
    if (!AU.ready) return;
    this.nextTime = AU.now() + 0.08;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },
  wake() { if (this.song && AU.ready && !this.timer) this.play(this.song); },
  stop() { this.song = null; },
  tick() {
    if (!this.song || !AU.ready || AU.ctx.state !== 'running') return;
    const spStep = 60 / (this.song.bpm * this.tempoMul) / 4;
    if (this.nextTime < AU.now() - 0.2) this.nextTime = AU.now() + 0.02;
    while (this.nextTime < AU.now() + 0.12) {
      this.playStep(this.step, this.nextTime, spStep);
      this.nextTime += spStep; this.step++;
    }
  },
  note(deg, octave) {
    const s = this.song;
    const len = s.scale.length;
    const d = ((deg % len) + len) % len;
    return s.root + this.transpose + s.scale[d] + 12 * (octave + Math.floor(deg / len));
  },
  playStep(i, t, sp) {
    const s = this.song;
    const st = i % 16;
    const bar = Math.floor(i / 16);
    const chord = s.prog[bar % s.prog.length];
    const v = this.duck;
    const bus = AU.music;
    if (s.kick[st] === 'x') tone('triangle', 150, 42, 0.16, 0.55 * v, { when: t, bus });
    if (s.snare[st] === 'x') { noise(0.12, 0.22 * v, 'bandpass', 1900, 1200, { when: t, bus }); tone('triangle', 210, 160, 0.08, 0.1 * v, { when: t, bus }); }
    if (s.hat[st] === 'x') noise(0.03, (st % 4 === 2 ? 0.09 : 0.05) * v, 'highpass', 7500, 7000, { when: t, bus });
    if (s.bass[st] === 'x') {
      const f = midiHz(this.note(chord, -2));
      tone('square', f, f, sp * 1.7, 0.1 * v, { when: t, bus, filter: 'lowpass', cutoff: 700, cutoffEnd: 260 });
    }
    const ln = s.lead[(bar % 2) * 16 + st];
    if (ln >= 0) {
      const f = midiHz(this.note(chord + ln, 0));
      tone('square', f, f, sp * 0.9, 0.035 * v, { when: t, bus });
    }
    if (st === 0) { // pad: a soft triangle triad every bar
      for (const k of [0, 2, 4]) { const f = midiHz(this.note(chord + k, -1)); tone('triangle', f, f, sp * 15, 0.03 * v, { when: t, bus, attack: 0.08 }); }
    }
  },
};
const SONGS = {
  title: makeSong(11, 100, 57, 'dorian', 'chill'),
  results: makeSong(12, 112, 60, 'major', 'chill'),
  podium: makeSong(13, 120, 60, 'major', 'four'),
  over: makeSong(14, 84, 52, 'minor', 'chill'),
};

// ============================================================================================
// DRAW_UTILS — fog grey levels, crisp line widths and the small vector shapes everything uses
// ============================================================================================
function fogLevel(dz) {
  const t = clamp(dz / CFG.far, 0, 1);
  return Math.min(4, Math.floor(Math.pow(t, 1.5) * 5));
}
function lineW(k) { return clamp(k * 0.12, 1, 5); }
function poly(c, pts) {
  c.beginPath();
  c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.closePath();
}
// A wobbling goo blob: the one green thing in the game.
function gooBlob(c, x, y, r, seed, t, color) {
  c.beginPath();
  const n = 7;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU;
    const wob = 1 + 0.18 * Math.sin(seed * 3.1 + i * 2.3 + t * 9) + 0.12 * Math.sin(seed + i * 5.7);
    const px = x + Math.cos(a) * r * wob, py = y + Math.sin(a) * r * wob;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
  c.fillStyle = color || GOO_C;
  c.fill();
}
// A flat goo splat with drips: used for decals, hits and the windscreen.
function gooSplat(c, x, y, r, seed, alpha) {
  const rng = mulberry32(seed | 0);
  c.save();
  c.globalAlpha *= alpha == null ? 1 : alpha;
  c.fillStyle = GOO_C;
  c.beginPath();
  const n = 11;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU;
    const rr = r * (i % 2 ? 0.55 + rng() * 0.3 : 0.9 + rng() * 0.45);
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath(); c.fill();
  for (let i = 0; i < 4; i++) {
    const a = rng() * TAU, d = r * (1.2 + rng() * 0.6);
    c.fillRect(x + Math.cos(a) * d - r * 0.12, y + Math.sin(a) * d - r * 0.12, r * 0.24, r * 0.24);
  }
  c.restore();
}
function strokeBox(c, x, y, w, h, lw, color) {
  c.lineWidth = lw; c.strokeStyle = color || '#fff';
  c.strokeRect(x + lw / 2, y + lw / 2, w - lw, h - lw);
}

// ============================================================================================
// TRACK_BUILDER — turns a track def into sorted "things" along s, hazard zones and a racing line
// ============================================================================================
let TRACK = null;

function weightedWith(rng, table) {
  let total = 0;
  for (const row of table) total += row[1];
  let r = rng() * total;
  for (const row of table) { r -= row[1]; if (r <= 0) return row[0]; }
  return table[table.length - 1][0];
}

function buildTrack(index, opts) {
  const def = TRACKS[index];
  const mirror = opts && opts.mirror ? -1 : 1;
  const diff = opts ? opts.diff : 1;
  const L = def.len;
  const rng = mulberry32(def.seed + (mirror < 0 ? 777 : 0));
  const r = (a, b) => a + (b - a) * rng();
  const toW = (list) => list.map(([a, k, p]) => [a, TAU * k / L, p]);
  const T = {
    index, def, L, mirror, curves: toW(def.curves), hills: toW(def.hills),
    things: [], zones: [], keys: [], lineU: null, lineV: null, scenery: [], stars: [],
  };
  const extra = mirror < 0 ? 0.8 : 0;
  const winW = def.win[0] + CFG.windowAdj[diff] - extra;
  const winH = def.win[1] + CFG.windowAdj[diff] * 0.6 - extra * 0.6;
  let cu = 0, cv = 6.5;
  const nextCentre = (w, h) => {
    cu = clamp(cu + r(-7, 7), -CFG.halfW + w / 2 + 0.6, CFG.halfW - w / 2 - 0.6);
    cv = clamp(cv + r(-4, 4), h / 2 + 0.8, CFG.ceil - h / 2 - 0.8);
    return [cu, cv];
  };
  const add = (t) => { t.decals = []; T.things.push(t); return t; };
  const gate = (s, more) => {
    const [u, v] = nextCentre(winW, winH);
    T.keys.push([s, u, v]);
    return add(Object.assign({ kind: 'gate', s, u, v, w: winW, h: winH, slide: 0, period: 2.4, phase: r(0, TAU) }, more || {}));
  };
  const hazards = def.hazards;
  let s = 160;
  let n = 0;
  const table = Object.entries(def.beats);
  while (s < L - 110) {
    let beat = n < 2 ? 'GATE' : weightedWith(rng, table);
    n++;
    switch (beat) {
      case 'GATE':
        gate(s, def.slide && rng() < 0.6 ? { slide: def.slide * r(0.6, 1) } : null);
        break;
      case 'DOUBLE':
        gate(s); gate(s + 30); s += 30;
        break;
      case 'PILLARS': {
        const off = r(-2.5, 2.5);
        const bars = [-8 + off, -2.6 + off, 2.6 + off, 8 + off].filter((u) => Math.abs(u) < CFG.halfW - 0.5).map((u) => ({ u, w: 1.8 }));
        const gaps = [];
        for (let i = 0; i <= bars.length; i++) {
          const a = i === 0 ? -CFG.halfW : bars[i - 1].u + bars[i - 1].w / 2;
          const b = i === bars.length ? CFG.halfW : bars[i].u - bars[i].w / 2;
          if (b - a > 2.6) gaps.push((a + b) / 2);
        }
        let best = gaps[0];
        for (const g of gaps) if (Math.abs(g - cu) < Math.abs(best - cu)) best = g;
        cu = best;
        T.keys.push([s, best, cv]);
        add({ kind: 'pillars', s, bars, gaps });
        break;
      }
      case 'RING_LINE': {
        const side = rng() < 0.5 ? -1 : 1;
        const ru = clamp(cu + side * r(3, 5), -9, 9), rv = clamp(cv + r(-2, 2.5), 2.5, 11.5);
        for (let i = 0; i < 3; i++) add({ kind: 'ring', s: s - 20 + i * 14, u: ru + side * i * 0.8, v: rv, r: CFG.ringR, spin: r(0, TAU) });
        break;
      }
      case 'CUBE_ROW': {
        const v = clamp(cv + r(-1.5, 1.5), 2.5, 11.5);
        const us = [-5.5, 0, 5.5].map((d) => clamp(cu + d, -10.5, 10.5));
        let far = 0;
        us.forEach((u, i) => { if (Math.abs(u - cu) > Math.abs(us[far] - cu)) far = i; });
        us.forEach((u, i) => add({ kind: 'cube', s: s - 25, u, v, gold: i === far, back: 0, spin: r(0, TAU) }));
        break;
      }
      case 'BALL_ARC': {
        const amp = r(2, 4.5), ph = r(0, TAU);
        for (let i = 0; i < 6; i++) add({ kind: 'coin', s: s - 35 + i * 7, u: clamp(cu + Math.sin(ph + i * 0.7) * amp, -10.5, 10.5), v: clamp(cv + Math.cos(ph + i * 0.5) * 1.5, 1.5, 12.5), back: 0 });
        break;
      }
      case 'BLOCKS': {
        const blocks = [];
        const bu = clamp(cu + r(-3, 3), -8, 8), bv = clamp(cv + r(-2, 2), 2.5, 11);
        for (const [du, dv] of [[-2.1, 0], [0, 0], [2.1, 0], [-1, 2.1], [1, 2.1], [0, -2.1]]) if (rng() < 0.8) blocks.push({ u: bu + du, v: bv + dv, hp: 1, s0: 1 });
        if (blocks.length) add({ kind: 'blocks', s: s - 18, blocks });
        gate(s + 10);
        s += 10;
        break;
      }
      case 'HAZARD': {
        const hz = hazards[Math.floor(rng() * hazards.length)];
        if (hz === 'paddle') gate(s, { paddle: { h: winH * 0.55, w: 1.2, speed: r(0.25, 0.4), phase: r(0, TAU) } });
        else if (hz === 'slider') gate(s, { slide: 3, period: r(2.2, 2.8) });
        else if (hz === 'ball') { add({ kind: 'ball', s, size: 2.6, v: clamp(cv, 3, 11), speed: r(7, 11), phase: r(0, TAU), vAmp: r(1, 2.5) }); }
        else if (hz === 'curtain') {
          const side = rng() < 0.5 ? -1 : 1;
          add({ kind: 'curtain', s, u0: side < 0 ? -CFG.halfW : 0.5, u1: side < 0 ? -0.5 : CFG.halfW, on: 1.2, off: 1.2, phase: r(0, 2.4) });
          cu = clamp(-side * 6, -8, 8);
          T.keys.push([s, cu, cv]);
        } else if (hz === 'updraft') {
          const uc = clamp(cu + r(-4, 4), -8, 8);
          T.zones.push({ kind: 'updraft', s0: s - 25, s1: s + 25, u0: uc - 3.5, u1: uc + 3.5, lift: 50 });
          gate(s + 32, null);
          s += 32;
        } else if (hz === 'wind') {
          T.zones.push({ kind: 'wind', s0: s - 30, s1: s + 40, dir: rng() < 0.5 ? -1 : 1, accel: 6 });
          gate(s + 10, null);
          s += 10;
        } else if (hz === 'rotor') {
          const v = clamp(cv, 4.5, 9.5);
          const ang = r(0, TAU);
          add({ kind: 'rotor', s, u: clamp(cu * 0.5, -4, 4), v, len: 6.2, w: 1.1, speed: r(0.22, 0.3) * TAU * (rng() < 0.5 ? -1 : 1), angle: ang, spun: ang, jam: 0 });
          T.keys.push([s, clamp(cu * 0.5, -4, 4) + 7.5, v]);
          cu = clamp(cu * 0.5, -4, 4) + 7.5;
        } else if (hz === 'lowg') {
          T.zones.push({ kind: 'lowg', s0: s - 40, s1: s + 70 });
          gate(s + 15, null);
          s += 15;
        } else if (hz === 'laser') {
          add({ kind: 'laser', s, period: 0.9, phase: r(0, 1.8), split: clamp(cv, 4, 10) });
          T.keys.push([s, cu, cv]);
        }
        break;
      }
      default: // BREATHER
        s += 20;
        break;
    }
    s += def.spacing * r(0.92, 1.15);
  }
  T.things.sort((a, b) => a.s - b.s);
  T.zones.sort((a, b) => a.s0 - b.s0);
  // The racing line: smooth interpolation through every window centre; the net is drawn on it.
  const keys = T.keys.slice().sort((a, b) => a[0] - b[0]);
  if (!keys.length) keys.push([0, 0, 6]);
  const N = Math.ceil(L / 2);
  T.lineU = new Float32Array(N); T.lineV = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const s0 = i * 2;
    let k = keys.findIndex((kk) => kk[0] > s0);
    const b = k === -1 ? keys[0] : keys[k];
    const a = k === -1 ? keys[keys.length - 1] : k === 0 ? keys[keys.length - 1] : keys[k - 1];
    let sa = a[0], sb = b[0];
    if (sa > s0) sa -= L;
    if (sb < s0) sb += L;
    const t = sb === sa ? 0 : smooth01((s0 - sa) / (sb - sa));
    T.lineU[i] = lerp(a[1], b[1], t);
    T.lineV[i] = lerp(a[2], b[2], t);
  }
  // Scenery: city towers and void stars, placed once per track.

// Spatial gap from race distance a to b along the looping track, in [-L/2, L/2): positive when b

function lineUAt(s) { const T = TRACK; return T.lineU[Math.floor(wrap(s, T.L) / 2) % T.lineU.length]; }

function cxAt(s) { let x = 0; for (const c of TRACK.curves) x += c[0] * Math.sin(c[1] * s + c[2]); return x * TRACK.mirror; }
function cxD(s) { let x = 0; for (const c of TRACK.curves) x += c[0] * c[1] * Math.cos(c[1] * s + c[2]); return x * TRACK.mirror; }

// Does a racer at (u, v) crossing thing th at time t hit it? Returns 'bonk', 'goop' or null.

      const cu = gateCentreU(th, t);

      if (!inside) return 'bonk';

        const pu = paddleU(th, t);

      }

    }

      for (const b of th.bars) if (Math.abs(u - b.u) < b.w / 2 + h * 0.7) return 'bonk';
      return null;

      for (const b of th.blocks) if (b.hp > 0 && Math.abs(u - b.u) < 1 + h && Math.abs(v - b.v) < 1 + h) return 'bonk';
      return null;

      const [bu, bv] = ballPos(th, t);
      return Math.abs(u - bu) < th.size / 2 + h && Math.abs(v - bv) < th.size / 2 + h ? 'bonk' : null;

    case 'rotor': {
      for (let k = 0; k < 2; k++) {
        const a = th.spun + k * Math.PI / 2;
        const dx = Math.cos(a), dy = Math.sin(a);

}

// Where an AI racer should aim to pass thing th, arriving at time t.
function thingAim(th, u, v, t) {

    case 'gate': {
      let au = gateCentreU(th, t), av = th.v;

        const pu = paddleU(th, t);
        au = pu > au ? au - th.w * 0.28 : au + th.w * 0.28;
      }
      return [au, av];
    }
    case 'pillars': {
      let best = th.gaps[0];
      for (const g of th.gaps) if (Math.abs(g - u) < Math.abs(best - u)) best = g;
      return [best, v];
    }
    case 'blocks': {
      // aim at the side with the most room
      const lo = Math.min(...th.blocks.filter((b) => b.hp > 0).map((b) => b.u), 99);
      const hi = Math.max(...th.blocks.filter((b) => b.hp > 0).map((b) => b.u), -99);
      if (lo > 90) return null;
      return [lo + 12 > CFG.halfW - hi ? lo - 3.5 : hi + 3.5, v];
    }
    case 'ball': {
      const [bu] = ballPos(th, t);
      return [bu > 0 ? bu - 6 : bu + 6, v];
    }
    case 'rotor': {
      const a = th.spun + th.speed * (t - world.t) + Math.PI / 4;   // the gap between blades when we arrive
      return [th.u + Math.cos(a) * th.len * 0.75, th.v + Math.sin(a) * th.len * 0.75];
    }
    case 'curtain':
      return [th.u0 < 0 ? 6 : -6, v];   // always take the dry side
    case 'laser': {
      const st = laserState(th, t);
      return [u, st.half === 0 ? th.split * 0.5 : (th.split + CFG.ceil) / 2];
    }
    default:
      return null;
  }
}

// ============================================================================================
// PROJECTION — track coordinates (s along, u lateral, v height) to screen, camera on the tangent
// ============================================================================================
const cam = { s: 0, u: 0, v: 6, f: CFG.focal, roll: 0, X: 0, Xd: 0, Y: 0, Yd: 0, cos: 1, sin: 0, hz: CFG.horizon, ox: 0, oy: 0 };

const PT2 = { x: 0, y: 0, k: 0, dz: 0 };

function setCamera(s, u, v) {
  cam.s = wrap(s, TRACK.L); cam.u = u; cam.v = v;
  cam.X = cxAt(cam.s) + u; cam.Xd = cxD(cam.s);
  cam.Y = cyAt(cam.s) + v; cam.Yd = cyD(cam.s);

}
// Distance ahead of the camera along the track, wrapped to [-120, L-120).
function relDz(s) { let d = wrap(s - cam.s, TRACK.L); if (d > TRACK.L - 120) d -= TRACK.L; return d; }
function projectDz(dz, u, v, out) {

  const k = cam.f / dz;

}
// A cross-section of the track at one dz is an affine map: origin + u*A + v*B.
const SLAB = { ox: 0, oy: 0, ax: 0, ay: 0, bx: 0, by: 0, k: 0, dz: 0 };

  SLAB.ax = PT.k * cam.cos; SLAB.ay = PT.k * cam.sin;
  SLAB.bx = PT.k * cam.sin; SLAB.by = -PT.k * cam.cos;

function sy(S, u, v) { return S.oy + u * S.ay + v * S.by; }

function seg3(c, dz0, u0, v0, dz1, u1, v1) {

// ============================================================================================
// CORRIDOR_RENDER — sky, horizon, rails, posts, the dashed net racing line and each track motif
// ============================================================================================
function drawSky(c, T) {
  c.fillStyle = '#000';
  c.fillRect(0, 0, W, H);
  const motif = T.def.motif;
  const heading = cxD(cam.s);
  const shift = -Math.atan(heading) * cam.f * 0.9;
  if (T.stars.length) {
    c.fillStyle = '#fff';
    for (const st of T.stars) {
      const x = wrap(st[0] + shift, 2400) - 560;
      const y = st[1] + cam.oy + (cam.hz - CFG.horizon) * 0.5;
      if (x < -4 || x > W + 4) continue;
      c.globalAlpha = motif === 'void' ? 0.35 + 0.65 * st[3] : 0.25 * st[3];
      c.fillRect(x, y, st[2], st[2]);
    }
    c.globalAlpha = 1;
  }
  if (motif === 'city') {
    // far skyline: a strip of blocky silhouettes that slides with the heading
    c.fillStyle = '#0d0d0d'; c.strokeStyle = '#303030'; c.lineWidth = 2;
    const rng = mulberry32(77);
    c.beginPath();
    let x = wrap(shift * 0.6, 1600) - 1600;
    while (x < W + 200) {
      const w = 40 + rng() * 90, h = 30 + rng() * 120;
      c.rect(x, cam.hz + cam.oy - h, w, h + 4);
      x += w + 6;
    }
    c.fill(); c.stroke();
  }
  // horizon line, rolled with the camera
  c.save();
  c.translate(W / 2 + cam.ox, cam.hz + cam.oy);
  c.rotate(cam.roll);
  c.fillStyle = motif === 'void' ? '#141414' : '#262626';
  c.fillRect(-W, -1, W * 2, 2);
  c.restore();
}

const SEG_STEP = 4;
function drawCorridor(c, T) {
  const motif = T.def.motif;
  const far = CFG.far;
  const s0 = cam.s;
  const startI = Math.ceil((s0 + CFG.near) / SEG_STEP);
  const endI = Math.floor((s0 + far) / SEG_STEP);
  const hw = CFG.halfW, ch = CFG.ceil;
  c.lineCap = 'square';
  // floor tiles / wall stripes first (they sit under the rails)
  if (motif === 'checker') {
    for (let i = endI; i >= startI; i--) {
      const sA = i * SEG_STEP, dzA = sA - s0, dzB = dzA + SEG_STEP;
      if (dzA < CFG.near + 0.1) continue;
      const lvl = fogLevel(dzA);
      if (lvl >= 4) continue;
      const row = i & 1;
      c.fillStyle = lvl < 2 ? '#1c1c1c' : '#121212';
      c.beginPath();
      for (let j = -3; j < 3; j++) {
        if (((j + 3 + row) & 1) === 0) continue;
        const ua = j * 4, ub = ua + 4;
        projectDz(dzA, ua, 0, PT); const x1 = PT.x, y1 = PT.y;
        projectDz(dzA, ub, 0, PT); const x2 = PT.x, y2 = PT.y;
        projectDz(dzB, ub, 0, PT); const x3 = PT.x, y3 = PT.y;
        projectDz(dzB, ua, 0, PT);
        c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3); c.lineTo(PT.x, PT.y); c.closePath();

        projectDz(dzA, ua, ch, PT); const a1 = PT.x, b1 = PT.y;
        projectDz(dzA, ub, ch, PT); const a2 = PT.x, b2 = PT.y;
        projectDz(dzB, ub, ch, PT); const a3 = PT.x, b3 = PT.y;
        projectDz(dzB, ua, ch, PT);
        c.moveTo(a1, b1); c.lineTo(a2, b2); c.lineTo(a3, b3); c.lineTo(PT.x, PT.y); c.closePath();
      }
      c.fill();
    }
  }
  if (motif === 'barcode') {
    for (let i = endI; i >= startI; i--) {
      const sA = i * SEG_STEP, dzA = sA - s0;
      if (dzA < CFG.near + 0.1) continue;
      const lvl = fogLevel(dzA);
      if (lvl >= 4) continue;
      const code = (Math.imul(i, 2654435761) >>> 0) % 7;
      if (code > 3) continue;
      const wdt = 0.6 + code * 0.7;
      c.fillStyle = GREYS[Math.min(4, lvl + 2)];
      c.beginPath();
      for (const side of [-1, 1]) {
        const u = side * hw;
        projectDz(dzA, u, 0, PT); const x1 = PT.x, y1 = PT.y;
        projectDz(dzA, u, ch, PT); const x2 = PT.x, y2 = PT.y;
        projectDz(dzA + wdt, u, ch, PT); const x3 = PT.x, y3 = PT.y;
        projectDz(dzA + wdt, u, 0, PT);
        c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3); c.lineTo(PT.x, PT.y); c.closePath();
      }
      c.fill();
    }
  }
  // rails and posts, grouped per fog level so each level is one stroke
  for (let lvl = 4; lvl >= 0; lvl--) {
    c.beginPath();
    let any = false;
    for (let i = startI; i < endI; i++) {
      const dzA = i * SEG_STEP - s0, dzB = dzA + SEG_STEP;
      if (fogLevel(dzA) !== lvl) continue;
      any = true;
      const floorRails = motif !== 'void';
      for (const side of [-1, 1]) {
        const u = side * hw;
        if (floorRails) seg3(c, dzA, u, 0, dzB, u, 0);
        seg3(c, dzA, u, ch, dzB, u, ch);
        if (i % 4 === 0 && motif !== 'void') seg3(c, dzA, u, 0, dzA, u, ch);
      }
      if (motif === 'court' && i % 10 === 0) seg3(c, dzA, -hw, 0, dzA, hw, 0);
      if (motif === 'court') { seg3(c, dzA, -hw + 2, 0, dzB, -hw + 2, 0); seg3(c, dzA, hw - 2, 0, dzB, hw - 2, 0); }
      if (motif === 'city' && i % 4 === 0) seg3(c, dzA, -hw, ch, dzA, hw, ch);

    c.lineWidth = lvl === 0 ? 3 : lvl === 1 ? 2 : 1.5;

    if (i % 2) continue;
    const sA = i * SEG_STEP, dzA = sA - s0, dzB = dzA + SEG_STEP * 0.9;
    if (dzA < CFG.near) continue;
    const uA = lineUAt(sA), uB = lineUAt(sA + SEG_STEP * 0.9);

    projectDz(dzA, uA - 0.32, netV, PT); const x1 = PT.x, y1 = PT.y;
    projectDz(dzA, uA + 0.32, netV, PT); const x2 = PT.x, y2 = PT.y;
    projectDz(dzB, uB + 0.32, netV, PT); const x3 = PT.x, y3 = PT.y;

  }

  for (let lap = 0; lap < 2; lap++) {
    const dz = relDz(lap * T.L);
    if (dz < CFG.near || dz > far) continue;
    const lvl = fogLevel(dz);
    for (let j = 0; j < 12; j++) {
      for (let row = 0; row < 2; row++) {
        if ((j + row) & 1) continue;
        c.beginPath();
        const ua = -hw + j * 2, ub = ua + 2;
        projectDz(dz + row * 1.2, ua, 0, PT); c.moveTo(PT.x, PT.y);
        projectDz(dz + row * 1.2, ub, 0, PT); c.lineTo(PT.x, PT.y);
        projectDz(dz + row * 1.2 + 1.2, ub, 0, PT); c.lineTo(PT.x, PT.y);
        projectDz(dz + row * 1.2 + 1.2, ua, 0, PT); c.lineTo(PT.x, PT.y);
        c.closePath(); c.fillStyle = GREYS[lvl]; c.fill();
      }
    }
  }
}

// City towers: wireframe boxes beside the corridor with dotted windows.
function drawScenery(c, T, list) {
  for (const b of T.scenery) {
    const dz = relDz(b.s);
    if (dz < 3 || dz > CFG.far) continue;
    list.push({ dz: dz + b.d, draw: drawTower, o: b });
  }
}
function drawTower(c, b, dz) {
  const lvl = fogLevel(dz);
  const d0 = dz - b.d, d1 = dz;
  if (d0 < CFG.near) return;
  const u0 = b.u - b.w / 2, u1 = b.u + b.w / 2;
  const S = slabAt(d0);
  c.fillStyle = '#000';
  c.beginPath(); slabRect(c, S, u0, 0, u1, b.h); c.fill();
  c.strokeStyle = GREYS[Math.min(4, lvl + 1)]; c.lineWidth = lvl < 2 ? 2 : 1;
  c.stroke();
  c.beginPath();
  const near = b.u > 0 ? u0 : u1;
  seg3(c, d0, near, 0, d1, near, 0);
  seg3(c, d0, near, b.h, d1, near, b.h);
  c.stroke();
  if (b.dots && lvl < 3) {
    c.fillStyle = GREYS[Math.min(4, lvl + 1)];
    const S2 = slabAt(d0);
    const px = Math.max(1, S2.k * 0.5);
    for (let yy = 3; yy < b.h - 2; yy += 3) for (let xx = u0 + 1.5; xx < u1 - 1; xx += 2.5) {
      if (((xx * 7 + yy * 13) | 0) % 3 === 0) continue;
      c.fillRect(sx(S2, xx, yy) - px / 2, sy(S2, xx, yy) - px / 2, px, px);
    }
  }
}

// ============================================================================================
// GATES_HAZARDS — update the moving parts and draw gates, pillars, rotors, lasers and pickups
// ============================================================================================
function updateThings(T, t, dt) {
  for (const th of T.things) {
    if (th.kind === 'rotor') {
      if (th.jam > 0) th.jam -= dt; else th.spun += th.speed * dt;
    }
    if ((th.kind === 'cube' || th.kind === 'coin') && th.back > 0) th.back -= dt;
  }
}

function queueThings(T, list, t) {
  let solid = 0;
  for (const th of T.things) {
    const dz = relDz(th.s);
    if (dz < CFG.near || dz > CFG.far) continue;
    list.push({ dz, draw: drawThing, o: th });
  }
  // the next 3 blocking things are drawn solid, the rest as outlines
  const sorted = list.filter((d) => d.o && d.o.kind && (d.o.kind === 'gate' || d.o.kind === 'pillars')).sort((a, b) => a.dz - b.dz);
  for (const d of sorted) d.solid = solid++ < 3;
}

function drawThing(c, th, dz, item) {
  switch (th.kind) {
    case 'gate': drawGate(c, th, dz, item.solid); break;
    case 'pillars': drawPillars(c, th, dz, item.solid); break;
    case 'blocks': drawBlocks(c, th, dz); break;
    case 'ring': drawRing(c, th, dz); break;
    case 'cube': if (!(th.back > 0)) drawCube(c, th, dz); break;
    case 'coin': if (!(th.back > 0)) drawCoin(c, th, dz); break;
    case 'ball': drawBall(c, th, dz); break;
    case 'rotor': drawRotor(c, th, dz); break;
    case 'curtain': drawCurtain(c, th, dz); break;
    case 'laser': drawLaser(c, th, dz); break;
  }
}

function drawDecals(c, S, th) {
  for (const d of th.decals) gooSplat(c, sx(S, d.u, d.v), sy(S, d.u, d.v), d.r * S.k, d.seed, 0.95);
}

function drawGate(c, g, dz, solid) {
  const t = world.t;
  const S = slabAt(dz);
  const lvl = fogLevel(dz);
  const cu = gateCentreU(g, t);
  const hw = CFG.halfW, ch = CFG.ceil;
  const u0 = cu - g.w / 2, u1 = cu + g.w / 2, v0 = g.v - g.h / 2, v1 = g.v + g.h / 2;
  // wall slab with the window cut out (even-odd)
  c.beginPath();
  slabRect(c, S, -hw, 0, hw, ch);
  slabRect(c, S, u0, v0, u1, v1);
  if (solid) {
    c.fillStyle = lvl === 0 ? '#2e2e2e' : lvl === 1 ? '#222' : '#181818';
    c.globalAlpha = 0.93;
    c.fill('evenodd');
    c.globalAlpha = 1;
  }
  c.strokeStyle = GREYS[Math.min(4, lvl + 1)]; c.lineWidth = lineW(S.k) * 0.6;
  c.stroke();
  if (solid && lvl < 3) {
    // sparse hatch dashes across the wall
    c.beginPath();
    for (let v = 1.5; v < ch; v += 2.5) {
      for (let u = -hw + ((v * 3) % 4); u < hw; u += 4) {
        if (u + 1.6 > u0 && u < u1 && v > v0 && v < v1) continue;
        c.moveTo(sx(S, u, v), sy(S, u, v)); c.lineTo(sx(S, Math.min(u + 1.6, hw), v), sy(S, Math.min(u + 1.6, hw), v));
      }
    }
    c.strokeStyle = GREYS[Math.min(4, lvl + 2)]; c.lineWidth = Math.max(1, lineW(S.k) * 0.4); c.stroke();
  }
  drawDecals(c, S, g);
  // the window: thick white frame and pulsing corner brackets
  const lw = lineW(S.k) * 1.4;
  c.beginPath(); slabRect(c, S, u0, v0, u1, v1);
  c.strokeStyle = GREYS[lvl]; c.lineWidth = lw; c.stroke();
  if (solid) {
    const next = g === world.nextTh;   // the window you are flying at gets big green target brackets
    const pulse = (next ? 0.55 : 0.35) + 0.15 * Math.sin(t * TAU * 2);
    const bl = Math.min(g.w, g.h) * (next ? 0.34 : 0.22);
    c.beginPath();
    for (const [cx, cy, dx, dy] of [[u0, v0, 1, 1], [u1, v0, -1, 1], [u1, v1, -1, -1], [u0, v1, 1, -1]]) {
      const ox = cx - dx * pulse, oy = cy - dy * pulse;
      c.moveTo(sx(S, ox + dx * bl, oy), sy(S, ox + dx * bl, oy));
      c.lineTo(sx(S, ox, oy), sy(S, ox, oy));
      c.lineTo(sx(S, ox, oy + dy * bl), sy(S, ox, oy + dy * bl));
    }
    c.strokeStyle = next ? GOO_C : '#fff'; c.lineWidth = next ? lw * 1.6 : lw; c.stroke();
    // drop-line from the sill to the floor so the height reads at a glance
    c.beginPath();
    c.moveTo(sx(S, cu, v0), sy(S, cu, v0)); c.lineTo(sx(S, cu, 0), sy(S, cu, 0));
    c.moveTo(sx(S, cu - 0.5, 0), sy(S, cu - 0.5, 0)); c.lineTo(sx(S, cu + 0.5, 0), sy(S, cu + 0.5, 0));
    c.strokeStyle = GREYS[Math.min(4, lvl + 1)]; c.lineWidth = Math.max(1, lw * 0.35); c.stroke();
  }
  if (g.paddle) {
    const pu = paddleU(g, t);
    c.beginPath(); slabRect(c, S, pu - g.paddle.w / 2, g.v - g.paddle.h / 2, pu + g.paddle.w / 2, g.v + g.paddle.h / 2);
    c.fillStyle = GREYS[lvl]; c.fill();
  }
}

function drawPillars(c, p, dz, solid) {
  const S = slabAt(dz);
  const lvl = fogLevel(dz);
  for (const b of p.bars) {
    c.beginPath(); slabRect(c, S, b.u - b.w / 2, 0, b.u + b.w / 2, CFG.ceil);
    c.fillStyle = solid ? GREYS[Math.min(4, lvl + 1)] : '#000'; c.fill();
    c.strokeStyle = GREYS[lvl]; c.lineWidth = lineW(S.k) * 0.8; c.stroke();
  }
  drawDecals(c, S, p);
}

function drawBlocks(c, th, dz) {
  const lvl = fogLevel(dz);
  for (const b of th.blocks) {
    if (b.hp <= 0) continue;
    const S = slabAt(dz);
    const S2 = slabAt(dz + 2);
    // back face, connectors, front face: a solid little Pong block
    c.beginPath(); slabRect(c, S2, b.u - 1, b.v - 1, b.u + 1, b.v + 1);
    c.strokeStyle = GREYS[Math.min(4, lvl + 1)]; c.lineWidth = 1.5; c.stroke();
    const S1 = slabAt(dz);
    c.beginPath(); slabRect(c, S1, b.u - 1, b.v - 1, b.u + 1, b.v + 1);
    c.fillStyle = GREYS[Math.min(4, lvl + 1)]; c.fill();
    c.strokeStyle = GREYS[lvl]; c.lineWidth = lineW(S1.k) * 0.6; c.stroke();
    c.beginPath(); c.moveTo(sx(S1, b.u - 0.5, b.v), sy(S1, b.u - 0.5, b.v)); c.lineTo(sx(S1, b.u + 0.5, b.v), sy(S1, b.u + 0.5, b.v));
    c.moveTo(sx(S1, b.u, b.v - 0.5), sy(S1, b.u, b.v - 0.5)); c.lineTo(sx(S1, b.u, b.v + 0.5), sy(S1, b.u, b.v + 0.5));
    c.strokeStyle = '#000'; c.lineWidth = Math.max(1, S1.k * 0.18); c.stroke();
    void S;
  }
  const S = slabAt(dz);
  drawDecals(c, S, th);
}

function drawRing(c, r, dz) {
  const S = slabAt(dz);
  const lvl = fogLevel(dz);
  const a = r.spin + world.t * 1.6;
  c.beginPath();
  for (let i = 0; i < 4; i++) {
    const ang = a * 0 + i * Math.PI / 2;
    const u = r.u + Math.cos(ang) * r.r, v = r.v + Math.sin(ang) * r.r;
    if (i === 0) c.moveTo(sx(S, u, v), sy(S, u, v)); else c.lineTo(sx(S, u, v), sy(S, u, v));
  }
  c.closePath();
  c.strokeStyle = GREYS[lvl]; c.lineWidth = lineW(S.k) * 1.6; c.stroke();
  // inner chevrons pointing forward
  const pulse = (Math.sin(a * 2) + 1) * 0.5;
  c.beginPath();
  const rr = r.r * (0.35 + 0.25 * pulse);
  c.moveTo(sx(S, r.u - rr, r.v), sy(S, r.u - rr, r.v)); c.lineTo(sx(S, r.u, r.v + rr * 0.6), sy(S, r.u, r.v + rr * 0.6)); c.lineTo(sx(S, r.u + rr, r.v), sy(S, r.u + rr, r.v));
  c.strokeStyle = GREYS[Math.min(4, lvl + 1)]; c.lineWidth = Math.max(1, lineW(S.k)); c.stroke();
}

function drawCube(c, cb, dz) {
  const S = slabAt(dz);
  const lvl = fogLevel(dz);
  const k = S.k;
  const x = sx(S, cb.u, cb.v), y = sy(S, cb.u, cb.v + Math.sin(world.t * 3 + cb.spin) * 0.25);
  const size = 1.6 * k;
  const a = world.t * 1.4 + cb.spin;
  c.save();
  c.translate(x, y); c.rotate(cam.roll);
  // a spinning jelly cube: two squares offset by the spin, joined at the corners
  const off = Math.sin(a) * size * 0.28, offy = -size * 0.22;
  c.strokeStyle = GREYS[lvl]; c.lineWidth = Math.max(1, lineW(k) * (cb.gold ? 1.3 : 0.9));
  c.strokeRect(-size / 2 + off, -size / 2 + offy, size, size);
  c.fillStyle = '#000';
  c.fillRect(-size / 2, -size / 2, size, size);
  c.strokeRect(-size / 2, -size / 2, size, size);
  c.beginPath();
  for (const [px, py] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    c.moveTo(px * size / 2, py * size / 2); c.lineTo(px * size / 2 + off, py * size / 2 + offy);
  }
  c.stroke();
  if (cb.gold) { c.strokeRect(-size / 2 - size * 0.16, -size / 2 - size * 0.16, size * 1.32, size * 1.32); }
  // the swirl glyph: a little square spiral
  c.beginPath();
  const q = size * 0.12;
  c.moveTo(0, 0); c.lineTo(q, 0); c.lineTo(q, q); c.lineTo(-q, q); c.lineTo(-q, -q * 2); c.lineTo(q * 2, -q * 2); c.lineTo(q * 2, q * 2);
  c.lineWidth = Math.max(1, size * 0.07); c.stroke();
  c.restore();
}

function drawCoin(c, cn, dz) {
  const S = slabAt(dz);
  const lvl = fogLevel(dz);
  const x = sx(S, cn.u, cn.v), y = sy(S, cn.u, cn.v);
  const s = 0.7 * S.k;
  const w = s * Math.max(0.15, Math.abs(Math.cos(world.t * 4 + cn.s)));
  c.fillStyle = GREYS[lvl];
  c.fillRect(x - w / 2, y - s / 2, w, s);
}

function drawBall(c, b, dz) {
  const [bu, bv] = ballPos(b, world.t);
  const lvl = fogLevel(dz);
  const S2 = slabAt(dz + b.size);
  c.beginPath(); slabRect(c, S2, bu - b.size / 2, bv - b.size / 2, bu + b.size / 2, bv + b.size / 2);
  c.fillStyle = GREYS[Math.min(4, lvl + 2)]; c.fill();
  const S = slabAt(dz);
  c.beginPath(); slabRect(c, S, bu - b.size / 2, bv - b.size / 2, bu + b.size / 2, bv + b.size / 2);
  c.fillStyle = GREYS[lvl]; c.fill();
  // its shadow on the floor
  c.beginPath(); slabRect(c, S, bu - b.size / 2, 0, bu + b.size / 2, 0.15);
  c.fillStyle = GREYS[Math.min(4, lvl + 2)]; c.fill();
  drawDecals(c, S, b);
}

function drawRotor(c, r, dz) {
  const S = slabAt(dz);
  const lvl = fogLevel(dz);
  const a0 = r.spun == null ? r.angle : r.spun;
  for (let k = 0; k < 2; k++) {
    const a = a0 + k * Math.PI / 2;
    const dx = Math.cos(a), dy = Math.sin(a), px = -dy, py = dx;
    const hw = r.w / 2;
    c.beginPath();
    const pts = [[r.u - dx * r.len + px * hw, r.v - dy * r.len + py * hw], [r.u + dx * r.len + px * hw, r.v + dy * r.len + py * hw],
      [r.u + dx * r.len - px * hw, r.v + dy * r.len - py * hw], [r.u - dx * r.len - px * hw, r.v - dy * r.len - py * hw]];
    pts.forEach(([u, v], i) => (i ? c.lineTo(sx(S, u, v), sy(S, u, v)) : c.moveTo(sx(S, u, v), sy(S, u, v))));
    c.closePath();
    c.fillStyle = r.jam > 0 ? GREYS[Math.min(4, lvl + 1)] : GREYS[lvl]; c.fill();
  }
  c.beginPath(); c.arc(sx(S, r.u, r.v), sy(S, r.u, r.v), Math.max(2, S.k * 0.9), 0, TAU);
  c.fillStyle = '#000'; c.fill(); c.strokeStyle = GREYS[lvl]; c.lineWidth = lineW(S.k) * 0.6; c.stroke();
  if (r.jam > 0) gooBlob(c, sx(S, r.u, r.v), sy(S, r.u, r.v), S.k * 1.1, 3, world.t);
  drawDecals(c, S, r);
}

function drawCurtain(c, cu, dz) {
  const S = slabAt(dz);
  const lvl = fogLevel(dz);
  const on = curtainOn(cu, world.t);
  c.beginPath();
  for (let u = cu.u0 + 0.6; u < cu.u1; u += 1.2) {
    const drip = (world.t * 9 + u * 3) % 2.4;
    for (let v = CFG.ceil - drip; v > 0; v -= 2.4) {
      c.moveTo(sx(S, u, v), sy(S, u, v)); c.lineTo(sx(S, u, Math.max(0, v - 1.2)), sy(S, u, Math.max(0, v - 1.2)));
    }
  }
  c.strokeStyle = on ? GOO_C : GREYS[Math.min(4, lvl + 2)];
  c.globalAlpha = on ? (lvl < 2 ? 0.9 : 0.6) : 0.5;
  c.lineWidth = Math.max(1, S.k * (on ? 0.28 : 0.12)); c.stroke();
  c.globalAlpha = 1;
  c.beginPath(); c.moveTo(sx(S, cu.u0, CFG.ceil), sy(S, cu.u0, CFG.ceil)); c.lineTo(sx(S, cu.u1, CFG.ceil), sy(S, cu.u1, CFG.ceil));
  c.strokeStyle = GREYS[lvl]; c.lineWidth = lineW(S.k) * 1.5; c.stroke();
}

function drawLaser(c, l, dz) {
  const S = slabAt(dz);
  const lvl = fogLevel(dz);
  const st = laserState(l, world.t);
  const flick = st.warn && Math.floor(world.t * 30) % 2 === 0;
  const bands = [[l.split, CFG.ceil], [0, l.split]];
  bands.forEach((band, i) => {
    const lit = (st.half === i) !== flick;
    c.beginPath();
    for (let v = band[0] + 0.5; v < band[1]; v += 1) {
      for (let u = -CFG.halfW; u < CFG.halfW; u += 1.5) {
        c.moveTo(sx(S, u, v), sy(S, u, v)); c.lineTo(sx(S, u + 0.9, v), sy(S, u + 0.9, v));
      }
    }
    c.strokeStyle = lit ? GREYS[lvl] : GREYS[4];
    c.lineWidth = Math.max(1, S.k * (lit ? 0.16 : 0.06)); c.stroke();
  });
  // frame posts
  c.beginPath(); slabRect(c, S, -CFG.halfW, 0, CFG.halfW, CFG.ceil);
  c.strokeStyle = GREYS[Math.min(4, lvl + 1)]; c.lineWidth = lineW(S.k); c.stroke();
}

function drawZones(c, T, list) {
  for (const z of T.zones) {
    const d0 = relDz(z.s0), d1 = relDz(z.s1);
    if (d1 < CFG.near || d0 > CFG.far) continue;
    list.push({ dz: Math.max(d0, CFG.near + 0.1), draw: drawZone, o: z, d1 });
  }
}
function drawZone(c, z, dz, item) {
  const d1 = Math.min(item.d1, CFG.far);
  const t = world.t;
  c.beginPath();
  if (z.kind === 'updraft') {
    for (let s = Math.ceil((cam.s + dz) / 3) * 3; s < cam.s + d1; s += 3) {
      const d = s - cam.s;
      for (let u = z.u0 + 0.8; u < z.u1; u += 1.6) {
        const v = (t * 8 + u * 2 + s) % CFG.ceil;
        seg3(c, d, u, v, d, u, Math.min(CFG.ceil, v + 1.2));
      }
    }
    c.strokeStyle = '#909090'; c.lineWidth = 1.5;
  } else if (z.kind === 'wind') {
    for (let s = Math.ceil((cam.s + dz) / 5) * 5; s < cam.s + d1; s += 5) {
      const d = s - cam.s;
      for (let v = 2; v < CFG.ceil; v += 3.5) {
        const u = ((t * 14 * z.dir + s * 1.7 + v * 5) % 24 + 24) % 24 - 12;
        seg3(c, d, u, v, d, u + z.dir * 1.8, v);
      }
    }
    c.strokeStyle = '#7a7a7a'; c.lineWidth = 1.5;
  } else if (z.kind === 'lowg') {
    for (let s = Math.ceil((cam.s + dz) / 6) * 6; s < cam.s + d1; s += 6) {
      const d = s - cam.s;
      for (let v = 1; v < CFG.ceil; v += 3) for (let u = -11; u <= 11; u += 4) {
        const bob = Math.sin(t * 2 + u + s) * 0.4;
        seg3(c, d, u, v + bob, d, u + 0.15, v + bob);
      }
    }
    c.strokeStyle = '#6c6c6c'; c.lineWidth = 2;
  }
  c.stroke();
}
